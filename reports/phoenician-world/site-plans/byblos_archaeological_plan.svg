<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <style>
      .bg { fill: #1c2333; }
      .grid { stroke: #2a344a; stroke-width: 1; }
      .precinct { fill: #2d3748; stroke: #4a5568; stroke-width: 2; rx: 12; }
      .temple-bg { fill: #3b3a30; stroke: #d69e2e; stroke-width: 2; }
      .podium { fill: #744210; stroke: #ecc94b; stroke-width: 2; }
      .obelisk { fill: #ecc94b; stroke: #d69e2e; stroke-width: 1.5; }
      .l-temple { fill: #2c3e50; stroke: #e53e3e; stroke-width: 2; stroke-dasharray: 4,4; }
      .ahiram { fill: #319795; stroke: #81e6d9; stroke-width: 2; rx: 6; }
      .harbor-water { fill: #1a365d; stroke: #3182ce; stroke-width: 2; rx: 8; }
      .quay { fill: #4a5568; stroke: #a0aec0; stroke-width: 2; }
      .ship { fill: #7b341e; stroke: #dd6b20; stroke-width: 2; }
      .portal { fill: #2b6cb0; stroke: #63b3ed; stroke-width: 2; rx: 6; }
      .label-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .label-sub { fill: #a0aec0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .label-node { fill: #f7fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" class="bg"/>

  <!-- Header -->
  <text x="40" y="45" class="label-title">ANCIENT BYBLOS (GEBAL / 𐤂𐤁𐤋) — ARCHAEOLOGICAL BENCHMARK PLAN</text>
  <text x="40" y="68" class="label-sub">UNESCO Site #295 · Roblox Cell (800, 10, 1600) · Maurice Dunand &amp; Pierre Montet Provenance</text>

  <!-- Ground Grid -->
  <g class="grid">
    <line x1="50" y1="100" x2="950" y2="100" />
    <line x1="50" y1="250" x2="950" y2="250" />
    <line x1="50" y1="400" x2="950" y2="400" />
    <line x1="50" y1="550" x2="950" y2="550" />
    <line x1="50" y1="700" x2="950" y2="700" />
    <line x1="200" y1="90" x2="200" y2="750" />
    <line x1="500" y1="90" x2="500" y2="750" />
    <line x1="800" y1="90" x2="800" y2="750" />
  </g>

  <!-- Sacred Precinct Ground -->
  <rect x="80" y="110" width="840" height="630" class="precinct"/>

  <!-- 1. Temple of the Obelisks -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="360" height="240" class="temple-bg" rx="4"/>
    <text x="180" y="28" class="label-node" fill="#ecc94b">TEMPLE OF THE OBELISKS (c. 1900–1600 BCE)</text>
    
    <!-- Central Sanctuary Podium & Cella -->
    <rect x="110" y="45" width="140" height="80" class="podium" rx="2"/>
    <text x="180" y="85" class="label-node" fill="#fff">SANCTUARY PODIUM / CELLA</text>
    <text x="180" y="105" class="label-sub" text-anchor="middle" fill="#ecc94b">Resheph Votive Altar</text>

    <!-- 26 Standing Obelisks in Courtyard -->
    <!-- Row 1 -->
    <circle cx="30" cy="50" r="7" class="obelisk"/>
    <circle cx="60" cy="45" r="7" class="obelisk"/>
    <circle cx="90" cy="50" r="7" class="obelisk"/>
    <circle cx="270" cy="50" r="7" class="obelisk"/>
    <circle cx="300" cy="45" r="7" class="obelisk"/>
    <circle cx="330" cy="50" r="7" class="obelisk"/>
    <!-- Row 2 -->
    <circle cx="25" cy="100" r="7" class="obelisk"/>
    <circle cx="60" cy="105" r="7" class="obelisk"/>
    <circle cx="300" cy="105" r="7" class="obelisk"/>
    <circle cx="335" cy="100" r="7" class="obelisk"/>
    <!-- Row 3 -->
    <circle cx="30" cy="150" r="7" class="obelisk"/>
    <circle cx="60" cy="155" r="7" class="obelisk"/>
    <circle cx="90" cy="150" r="7" class="obelisk"/>
    <circle cx="270" cy="150" r="7" class="obelisk"/>
    <circle cx="300" cy="155" r="7" class="obelisk"/>
    <circle cx="330" cy="150" r="7" class="obelisk"/>
    <!-- Row 4 -->
    <circle cx="25" cy="195" r="7" class="obelisk"/>
    <circle cx="60" cy="200" r="7" class="obelisk"/>
    <circle cx="95" cy="195" r="7" class="obelisk"/>
    <circle cx="265" cy="195" r="7" class="obelisk"/>
    <circle cx="300" cy="200" r="7" class="obelisk"/>
    <circle cx="335" cy="195" r="7" class="obelisk"/>
    <!-- Row 5 (Great Obelisk of Abishemu highlighted) -->
    <circle cx="70" cy="225" r="9" class="obelisk" stroke="#fff" stroke-width="2"/>
    <circle cx="120" cy="220" r="7" class="obelisk"/>
    <circle cx="240" cy="220" r="7" class="obelisk"/>
    <circle cx="290" cy="225" r="7" class="obelisk"/>
    <text x="70" y="212" class="label-sub" fill="#fff" text-anchor="middle">Abishemu (#1)</text>
  </g>

  <!-- 2. Earlier L-Shaped Temple (Stratum layer) -->
  <g transform="translate(710, 140)">
    <path d="M 0 0 L 160 0 L 160 120 L 70 120 L 70 200 L 0 200 Z" class="l-temple"/>
    <text x="80" y="30" class="label-node" fill="#fc8181">L-SHAPED TEMPLE</text>
    <text x="80" y="50" class="label-sub" fill="#feb2b2" text-anchor="middle">c. 2600–2200 BCE</text>
    <text x="80" y="80" class="label-sub" fill="#a0aec0" text-anchor="middle">Excavated Stratum</text>
    <text x="35" y="160" class="label-sub" fill="#feb2b2" text-anchor="middle">Predecessor Cella</text>
  </g>

  <!-- 3. Ahiram Sarcophagus Pavilion -->
  <g transform="translate(110, 170)">
    <rect x="0" y="0" width="170" height="200" class="ahiram"/>
    <text x="85" y="30" class="label-node" fill="#fff">AHIRAM SARCOPHAGUS</text>
    <text x="85" y="50" class="label-sub" fill="#b2f5ea" text-anchor="middle">c. 1000 BCE · Royal Tomb V</text>
    
    <!-- Sarcophagus Chest & Lion corners -->
    <rect x="25" y="70" width="120" height="60" fill="#234e52" stroke="#4fd1c5" stroke-width="1.5" rx="3"/>
    <circle cx="35" cy="80" r="5" fill="#e6fffa"/>
    <circle cx="135" cy="80" r="5" fill="#e6fffa"/>
    <circle cx="35" cy="120" r="5" fill="#e6fffa"/>
    <circle cx="135" cy="120" r="5" fill="#e6fffa"/>
    <text x="85" y="105" class="label-node" fill="#e6fffa">4 Recumbent Lions</text>

    <!-- Epigraphy Decipherment Station -->
    <rect x="15" y="145" width="140" height="40" fill="#1d4044" stroke="#81e6d9" stroke-width="1.5" rx="4"/>
    <text x="85" y="170" class="label-node" fill="#81e6d9">22-Letter Alphabet Board</text>
  </g>

  <!-- 4. Scribe Ilu-milku Guide Spot -->
  <g transform="translate(450, 420)">
    <circle cx="50" cy="20" r="16" fill="#d69e2e" stroke="#fff" stroke-width="2"/>
    <text x="50" y="24" class="label-node" fill="#1a202c">NPC</text>
    <text x="50" y="55" class="label-node" fill="#ecc94b">Ilu-milku Scribe</text>
    <text x="50" y="72" class="label-sub" fill="#cbd5e0" text-anchor="middle">Master Epigrapher</text>
  </g>

  <!-- Portals: Hub Return & Modern Byblos -->
  <g transform="translate(300, 440)">
    <rect x="0" y="0" width="110" height="44" class="portal"/>
    <text x="55" y="26" class="label-node" fill="#fff">Phoenician Hub</text>
  </g>
  <g transform="translate(590, 440)">
    <rect x="0" y="0" width="110" height="44" class="portal" fill="#2c5282" stroke="#63b3ed"/>
    <text x="55" y="26" class="label-node" fill="#fff">Modern Byblos</text>
  </g>

  <!-- 5. Ancient Harbour & Quays -->
  <g transform="translate(110, 520)">
    <!-- Water Basin -->
    <rect x="0" y="0" width="780" height="190" class="harbor-water"/>
    
    <!-- Stone Quay Pier -->
    <rect x="20" y="20" width="740" height="50" class="quay"/>
    <text x="390" y="50" class="label-node" fill="#fff">ANCIENT BRONZE AGE HARBOUR QUAY (Cedar Timber Export Pier)</text>

    <!-- Phoenician Merchant Gaulos Ship -->
    <g transform="translate(250, 90)">
      <path d="M 0 35 Q 20 60 150 60 Q 280 60 300 35 Q 260 10 150 10 Q 40 10 0 35 Z" class="ship"/>
      <!-- Hippos Figurehead -->
      <circle cx="10" cy="25" r="10" fill="#dd6b20" stroke="#fbd38d" stroke-width="1.5"/>
      <text x="150" y="40" class="label-node" fill="#fff">Phoenician Gaulos Merchantman (Round Ship)</text>
      <!-- Mast & Sail -->
      <line x1="150" y1="0" x2="150" y2="55" stroke="#fbd38d" stroke-width="3"/>
      <rect x="90" y="5" width="120" height="25" fill="#edf2f7" opacity="0.9" rx="2"/>
      <text x="150" y="22" class="label-sub" fill="#1a202c" font-weight="bold" text-anchor="middle">Linen Square Sail</text>
    </g>

    <!-- Cargo Manifest Interactive Stand -->
    <g transform="translate(60, 30)">
      <rect x="0" y="0" width="120" height="30" fill="#1a202c" stroke="#68d391" stroke-width="1.5" rx="3"/>
      <text x="60" y="20" class="label-sub" fill="#68d391" text-anchor="middle" font-weight="bold">Cargo Manifest Stand</text>
    </g>
  </g>
</svg>
