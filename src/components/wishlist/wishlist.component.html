<div class="animate-fade-in">
  @if (activeProfile(); as profile) {
    <h1 class="text-4xl font-bold text-center text-coral mb-8">{{ profile.name }}'s Wishlist</h1>
    
    @if (wishlist().length > 0) {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        @for (item of wishlist(); track item.id) {
          <div class="bg-white rounded-lg shadow-lg overflow-hidden transform transition-transform hover:scale-105 duration-300 flex flex-col">
            <img [src]="item.imageUrl" [alt]="item.name" class="w-full h-64 object-cover">
            <div class="p-6 flex flex-col flex-grow">
              <h3 class="text-xl font-bold text-charcoal mb-2">{{ item.name }}</h3>
              <div class="flex justify-between items-center mt-auto pt-4">
                <span class="text-2xl font-bold text-sunny-yellow flex items-center">
                  <span class="mr-2">⭐</span> {{ item.tokenPrice }}
                </span>
                <button (click)="askParent(item)" class="bg-powder-blue text-charcoal font-bold py-2 px-4 rounded-full hover:bg-opacity-80 transition-colors">
                  Ask Parent
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="text-center bg-white p-12 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-charcoal mb-4">Your Wishlist is Empty!</h2>
        <p class="text-gray-600 mb-6">Go to the shop to find amazing things and add them to your list.</p>
        <button (click)="userService.setView('shop')" class="bg-coral text-white font-bold py-3 px-8 rounded-full hover:bg-opacity-80 transition-transform transform hover:scale-105">
            Go to Shop
        </button>
      </div>
    }
  }
</div>
