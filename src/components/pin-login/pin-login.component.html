<div class="max-w-sm mx-auto mt-8 animate-fade-in text-center">
  @if (profile(); as childProfile) {
    <div class="bg-white p-8 rounded-lg shadow-lg">
      <img [src]="childProfile.avatar" [alt]="childProfile.name" class="w-32 h-32 rounded-full object-cover mx-auto mb-4 border-4 border-coral">
      <h2 class="text-3xl font-bold text-charcoal">Hi, {{ childProfile.name }}!</h2>
      <p class="text-gray-600 mb-8">Please enter your 4-digit PIN.</p>
      
      @if (isLockedOut()) {
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg text-left mb-6">
          <p class="font-bold">Account Locked</p>
          <p>Too many incorrect attempts. Please ask your parent for help or try again later.</p>
        </div>
      } @else {
        <form (submit)="submitPin()">
          <div class="mb-4">
            <label for="pin" class="sr-only">PIN</label>
            <input 
              type="password" 
              id="pin" 
              name="pin" 
              [(ngModel)]="pin"
              maxlength="4"
              pattern="\\d{4}"
              required
              class="w-full text-center text-3xl tracking-[1.5em] px-4 py-3 border-2 border-soft-gray rounded-lg focus:outline-none focus:ring-2 focus:ring-coral"
              placeholder="••••"
            >
          </div>
          @if (error()) {
            <p class="text-red-500 text-center mb-4">{{ error() }}</p>
          }
          <button 
            type="submit" 
            [disabled]="loading() || pin().length !== 4"
            class="w-full bg-coral text-white font-bold py-3 px-6 rounded-full hover:bg-opacity-80 transition-transform transform hover:scale-105 disabled:bg-soft-gray disabled:cursor-not-allowed">
            @if (loading()) {
              <span>Checking...</span>
            } @else {
              <span>Enter</span>
            }
          </button>
        </form>
      }

      <div class="text-center mt-6">
        <button (click)="goBack()" class="font-bold text-sm text-charcoal hover:underline cursor-pointer">
          Not {{ childProfile.name }}? Go Back
        </button>
      </div>
    </div>
  } @else {
    <p>Loading profile...</p>
  }
</div>
