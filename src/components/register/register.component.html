<div class="max-w-md mx-auto mt-8 animate-fade-in">
  <div class="bg-white p-8 rounded-lg shadow-lg">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-charcoal">Create a Parent Account</h2>
      <p class="text-gray-600">Join MiraVerse to start the adventure!</p>
    </div>
    <form (submit)="register()">
      <div class="mb-4">
        <label for="name" class="block text-sm font-bold text-charcoal mb-2">Your Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="name" required
          class="w-full px-4 py-2 border border-soft-gray rounded-lg focus:outline-none focus:ring-2 focus:ring-coral">
      </div>
      <div class="mb-4">
        <label for="email" class="block text-sm font-bold text-charcoal mb-2">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required
          class="w-full px-4 py-2 border border-soft-gray rounded-lg focus:outline-none focus:ring-2 focus:ring-coral">
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-bold text-charcoal mb-2">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required
          class="w-full px-4 py-2 border border-soft-gray rounded-lg focus:outline-none focus:ring-2 focus:ring-coral">
      </div>
       @if (error()) {
        <p class="text-red-500 text-center mb-4">{{ error() }}</p>
      }
      <button type="submit" [disabled]="loading()"
        class="w-full bg-coral text-white font-bold py-3 px-6 rounded-full hover:bg-opacity-80 transition-transform transform hover:scale-105 disabled:bg-soft-gray disabled:cursor-not-allowed">
        @if(loading()) {
          <span>Creating Account...</span>
        } @else {
          <span>Create Account</span>
        }
      </button>
    </form>
    <div class="text-center mt-6">
      <p class="text-sm text-gray-600">
        Already have an account? 
        <a (click)="navigateToLogin.emit()" class="font-bold text-coral hover:underline cursor-pointer">Login here</a>
      </p>
    </div>
  </div>
</div>
