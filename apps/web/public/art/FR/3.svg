<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Scoring the Galette des Rois Pattern</title>
  <desc>Focused view of a baker delicately scoring spiral curved arcs into an egg-washed galette des rois with a fine steel blade, beside a small ceramic fève charm.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="egg-wash-dough" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fff8d4" />
      <stop offset="60%" stop-color="#f7dda4" />
      <stop offset="100%" stop-color="#e3be76" />
    </radialGradient>
    <linearGradient id="blade-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f2f2" />
      <stop offset="50%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#8a8a8a" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="500" fill="#2d221c" />

  <!-- Baker's wooden pastry board -->
  <ellipse cx="400" cy="270" rx="360" ry="170" fill="#8c623d" stroke="#5a3d24" stroke-width="6" />

  <!-- Unbaked Puff Pastry Disc with Golden Egg Wash -->
  <ellipse cx="400" cy="260" rx="270" ry="120" fill="url(#egg-wash-dough)" stroke="#d4a755" stroke-width="3" />

  <!-- Intricate Scored Spiral Swirls (Scoring with precision knife) -->
  <g fill="none" stroke="#b07a2a" stroke-width="3" opacity="0.9">
    <path d="M400,165 C480,185 570,225 615,265" />
    <path d="M280,180 C370,200 480,245 560,295" />
    <path d="M190,220 C290,230 420,270 510,325" />
    <path d="M170,265 C250,270 370,305 450,355" />

    <path d="M400,165 C320,185 230,225 185,265" />
    <path d="M520,180 C430,200 320,245 240,295" />
    <path d="M610,220 C510,230 380,270 290,325" />
    <path d="M630,265 C550,270 430,305 350,355" />
  </g>

  <!-- Scalloped decorative perimeter crimping (Chiqueté) -->
  <ellipse cx="400" cy="260" rx="265" ry="115" fill="none" stroke="#a0681c" stroke-width="2.5" stroke-dasharray="10,8" />

  <!-- Baker's Scoring Blade (Lame de boulanger) -->
  <g transform="translate(480, 130) rotate(-35)">
    <!-- Wooden handle -->
    <rect x="-80" y="-8" width="90" height="16" rx="8" fill="#5c381e" />
    <!-- Thin curved steel razor blade -->
    <path d="M10,-6 L55,-6 L65,0 L55,6 L10,6 Z" fill="url(#blade-steel)" stroke="#666" stroke-width="1" />
    <!-- Tip touching dough -->
    <circle cx="65" cy="0" r="3" fill="#fff" filter="url(#soft-glow)" />
  </g>

  <!-- Ceramic porcelain charm (Fève) waiting to be baked inside -->
  <g transform="translate(180, 360)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5" />
    <!-- Little painted ceramic crown emblem on the fève -->
    <polygon points="-8,3 -4,-5 0,-1 4,-5 8,3" fill="#ffd13b" stroke="#ab7d0f" stroke-width="1" />
  </g>
  
</svg>