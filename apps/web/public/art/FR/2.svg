<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Artisan Pastry Table &amp; Frangipane Ingredients</title>
  <desc>Watercolor composition of pastry making elements: a slab of French cultured butter, ceramic bowl of sweet almond frangipane cream, farm fresh eggs, vanilla beans, and flour on marble.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="marble-prep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f7f2" />
      <stop offset="100%" stop-color="#d9d6cd" />
    </linearGradient>
    <radialGradient id="egg-yolk-rich" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffea75" />
      <stop offset="55%" stop-color="#f77f00" />
      <stop offset="100%" stop-color="#d62828" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="500" fill="#faf6ef" />

  <!-- Baker's white marble workstation -->
  <polygon points="0,200 800,200 800,500 0,500" fill="url(#marble-prep)" stroke="#b5b0a3" stroke-width="4" />
  <!-- Flour dust swirl -->
  <ellipse cx="400" cy="360" rx="300" ry="90" fill="#ffffff" opacity="0.45" />

  <!-- Block of rich golden French cultured butter (Beurre de Tourage) -->
  <g transform="translate(140, 260)">
    <polygon points="0,50 110,25 150,55 40,80" fill="#fed668" stroke="#d4a32c" stroke-width="2" />
    <polygon points="0,50 40,80 40,130 0,100" fill="#e8ba46" stroke="#d4a32c" stroke-width="2" />
    <polygon points="40,80 150,55 150,105 40,130" fill="#f5c753" stroke="#d4a32c" stroke-width="2" />
  </g>

  <!-- Large ceramic bowl with almond Frangipane cream -->
  <g transform="translate(390, 220)">
    <ellipse cx="80" cy="110" rx="90" ry="32" fill="#d26938" />
    <path d="M-10,30 Q80,180 170,30 Z" fill="#eb8854" stroke="#c05726" stroke-width="3" />
    <ellipse cx="80" cy="30" rx="90" ry="26" fill="#f0ad81" />
    <!-- Frangipane almond cream inside -->
    <ellipse cx="80" cy="32" rx="82" ry="22" fill="#fff0b8" />
    <ellipse cx="80" cy="36" rx="60" ry="15" fill="#fde693" opacity="0.8" />
    <!-- Wooden whisk handle dipping in -->
    <line x1="80" y1="36" x2="140" y2="-40" stroke="#7a5528" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Farm fresh eggs & vanilla pod -->
  <g transform="translate(620, 310)">
    <!-- Egg 1 -->
    <ellipse cx="20" cy="30" rx="16" ry="22" transform="rotate(-15 20 30)" fill="#dfb387" stroke="#b28456" stroke-width="1.5" />
    <!-- Egg 2 -->
    <ellipse cx="55" cy="40" rx="16" ry="22" transform="rotate(35 55 40)" fill="#ecc59e" stroke="#b28456" stroke-width="1.5" />
    <!-- Cracked half showing deep orange yolk -->
    <circle cx="85" cy="70" r="14" fill="url(#egg-yolk-rich)" />

    <!-- Dark fragrant Madagascar vanilla beans -->
    <path d="M-50,85 Q-20,70 30,85" stroke="#201109" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M-45,95 Q-15,80 35,95" stroke="#201109" stroke-width="3.5" fill="none" stroke-linecap="round" />
  </g>
  
</svg>