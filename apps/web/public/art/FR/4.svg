<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Galette Rising in the Stone Deck Hearth</title>
  <desc>Dramatic watercolor view looking into the radiant warmth of a stone bakery oven as puff pastry layers rise into a thousand golden flaky leaves.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="oven-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fff2aa" />
      <stop offset="35%" stop-color="#ff9914" />
      <stop offset="70%" stop-color="#b8380b" />
      <stop offset="100%" stop-color="#2b0f07" />
    </radialGradient>
    <linearGradient id="galette-baking" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed678" />
      <stop offset="60%" stop-color="#d9771e" />
      <stop offset="100%" stop-color="#7a3407" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Stone oven interior darkness -->
  <rect width="800" height="500" fill="#1f110b" />

  <!-- Glowing fiery heart of the bakery stone deck -->
  <circle cx="400" cy="260" r="320" fill="url(#oven-glow)" opacity="0.9" />

  <!-- Heavy refractory stone deck floor (Sole de four) -->
  <polygon points="0,320 800,320 800,500 0,500" fill="#4d3224" stroke="#2d1a10" stroke-width="4" />
  <line x1="0" y1="400" x2="800" y2="400" stroke="#331e13" stroke-width="3" />

  <!-- Wooden Baker's Peel (Pelle de boulanger) supporting the pastry -->
  <g transform="translate(400, 310)">
    <ellipse cx="0" cy="40" rx="270" ry="90" fill="#8c5828" stroke="#543312" stroke-width="4" />
    <!-- Handle extending forward -->
    <rect x="-15" y="110" width="30" height="150" fill="#70441d" />

    <!-- Gloriously Rising Galette des Rois (Puffed layers) -->
    <!-- Lower caramelized puffed rim -->
    <path d="M-210,15 C-210,65 210,65 210,15 C210,-35 -210,-35 -210,15 Z" fill="#692906" />
    <!-- Hundreds of flaky caramelized pastry layers (feuilletage) -->
    <ellipse cx="0" cy="8" rx="200" ry="60" fill="#ba5d16" />
    <ellipse cx="0" cy="0" rx="190" ry="55" fill="url(#galette-baking)" />

    <!-- Spiral scored pattern blooming open -->
    <g fill="none" stroke="#fff1b8" stroke-width="3" opacity="0.8">
      <path d="M0,-45 C60,-30 120,-10 160,10" />
      <path d="M-100,-35 C-30,-20 60,0 130,25" />
      <path d="M0,-45 C-60,-30 -120,-10 -160,10" />
      <path d="M100,-35 C30,-20 -60,0 -130,25" />
    </g>

    <!-- Hot bubbling caramel glaze spots -->
    <ellipse cx="-40" cy="-10" rx="12" ry="5" fill="#521f04" />
    <ellipse cx="60" cy="5" rx="10" ry="4" fill="#521f04" />
    <ellipse cx="10" cy="-20" rx="8" ry="4" fill="#521f04" />

    <!-- Hot golden steam curls -->
    <g opacity="0.5">
      <path d="M-60,-50 Q-80,-100 -50,-150" stroke="#fff4cf" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M50,-50 Q70,-100 40,-150" stroke="#fff4cf" stroke-width="5" fill="none" stroke-linecap="round" />
    </g>
  </g>
  
</svg>