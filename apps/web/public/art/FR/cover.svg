<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Lyon Bakery &amp; Golden Galette des Rois</title>
  <desc>Watercolor illustration inside a historic Lyon boulangerie showing a golden glazed Galette des Rois scored with intricate spiral rosettes, a golden paper crown, and stalks of French wheat.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bakery-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e0" />
      <stop offset="60%" stop-color="#fae4ba" />
      <stop offset="100%" stop-color="#e8c68c" />
    </linearGradient>
    <radialGradient id="galette-golden" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffe49e" />
      <stop offset="45%" stop-color="#f5af38" />
      <stop offset="85%" stop-color="#c96d18" />
      <stop offset="100%" stop-color="#803b0c" />
    </radialGradient>
    <linearGradient id="marble-counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f4f0" />
      <stop offset="50%" stop-color="#e3e1dc" />
      <stop offset="100%" stop-color="#cfcdc7" />
    </linearGradient>
    <linearGradient id="gold-crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff194" />
      <stop offset="50%" stop-color="#ffd13b" />
      <stop offset="100%" stop-color="#c99516" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Bakery warm shop backdrop -->
  <rect width="800" height="500" fill="url(#bakery-light)" />

  <!-- Traditional Lyon Boulangerie Arched Window & Wooden Shelves in background -->
  <!-- Arched stone window frame -->
  <path d="M120,0 L120,240 Q400,100 680,240 L680,0 Z" fill="#edd9be" stroke="#cbb291" stroke-width="8" />
  
  <!-- Bakery wooden bread shelves with rustic baguettes & batards -->
  <g transform="translate(180, 80)">
    <!-- Shelf 1 -->
    <rect x="0" y="50" width="440" height="12" fill="#80532e" stroke="#5a381c" stroke-width="2" />
    <!-- Golden baguettes leaning -->
    <polygon points="50,50 65,50 90,-20 75,-20" fill="#df9f45" stroke="#a4691e" stroke-width="2" />
    <polygon points="80,50 95,50 120,-20 105,-20" fill="#e8ab52" stroke="#a4691e" stroke-width="2" />
    <polygon points="110,50 125,50 150,-20 135,-20" fill="#df9f45" stroke="#a4691e" stroke-width="2" />
    <!-- Brioche loaves -->
    <circle cx="260" cy="35" r="18" fill="#d98929" stroke="#995813" stroke-width="2" />
    <circle cx="260" cy="20" r="10" fill="#e59c3f" stroke="#995813" stroke-width="2" />
    <circle cx="340" cy="35" r="18" fill="#d98929" stroke="#995813" stroke-width="2" />
    <circle cx="340" cy="20" r="10" fill="#e59c3f" stroke="#995813" stroke-width="2" />
  </g>

  <!-- Foreground French Marble Display Counter -->
  <polygon points="0,240 800,240 800,500 0,500" fill="url(#marble-counter)" stroke="#b5b3ad" stroke-width="4" />
  <!-- Flour dusting accents on marble -->
  <ellipse cx="280" cy="360" rx="90" ry="40" fill="#ffffff" opacity="0.4" />
  <ellipse cx="520" cy="370" rx="120" ry="50" fill="#ffffff" opacity="0.3" />

  <!-- Centerpiece: Freshly Baked Golden Galette des Rois -->
  <g transform="translate(360, 350)">
    <!-- Shadow -->
    <ellipse cx="0" cy="20" rx="170" ry="70" fill="#2d2218" opacity="0.25" />
    <!-- Flaky puffed pastry perimeter rim (Pâte feuilletée) -->
    <ellipse cx="0" cy="0" rx="160" ry="68" fill="#a85210" />
    <ellipse cx="0" cy="-3" rx="155" ry="65" fill="url(#galette-golden)" />

    <!-- Classic Scored Spiral Pithiviers / Rosette Pattern -->
    <g fill="none" stroke="#7a3407" stroke-width="2.5" opacity="0.85">
      <path d="M0,-55 C50,-40 100,-20 130,5" />
      <path d="M-80,-45 C-20,-30 60,-10 110,20" />
      <path d="M-130,-20 C-60,-15 20,5 90,38" />
      <path d="M-145,10 C-80,10 0,25 60,50" />
      
      <path d="M0,-55 C-50,-40 -100,-20 -130,5" />
      <path d="M80,-45 C20,-30 -60,-10 -110,20" />
      <path d="M130,-20 C60,-15 -20,5 -90,38" />
      <path d="M145,10 C80,10 0,25 -60,50" />
    </g>

    <!-- Shiny egg-wash glaze highlights -->
    <ellipse cx="-40" cy="-20" rx="40" ry="12" fill="#fff7cc" opacity="0.4" transform="rotate(-15 -40 -20)" />
    <ellipse cx="35" cy="-10" rx="35" ry="10" fill="#fff7cc" opacity="0.35" transform="rotate(10 35 -10)" />

    <!-- Little puff pastry crust edge scalloping -->
    <ellipse cx="0" cy="0" rx="155" ry="65" fill="none" stroke="#682904" stroke-width="2" stroke-dasharray="8,6" />
  </g>

  <!-- Ornate Golden Epiphany Crown (Couronne des Rois) resting beside -->
  <g transform="translate(600, 290) rotate(12)">
    <!-- Golden cardstock crown with pointed crenellations -->
    <polygon points="0,50 15,10 30,35 50,0 70,35 85,10 100,50" fill="url(#gold-crown)" stroke="#ab7d0f" stroke-width="2" />
    <!-- Cutout jewel holes -->
    <circle cx="50" cy="22" r="4" fill="#ffffff" />
    <circle cx="25" cy="38" r="3" fill="#ffffff" />
    <circle cx="75" cy="38" r="3" fill="#ffffff" />
  </g>

  <!-- Stalks of golden wheat (Blé) on the counter -->
  <g transform="translate(120, 360) rotate(-25)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#c49a37" stroke-width="2.5" />
    <!-- Wheat grains -->
    <ellipse cx="100" cy="-8" rx="10" ry="4" transform="rotate(25 100 -8)" fill="#e5b850" />
    <ellipse cx="100" cy="8" rx="10" ry="4" transform="rotate(-25 100 8)" fill="#e5b850" />
    <ellipse cx="120" cy="-8" rx="10" ry="4" transform="rotate(25 120 -8)" fill="#e5b850" />
    <ellipse cx="120" cy="8" rx="10" ry="4" transform="rotate(-25 120 8)" fill="#e5b850" />
    <ellipse cx="140" cy="-8" rx="10" ry="4" transform="rotate(25 140 -8)" fill="#e5b850" />
    <ellipse cx="140" cy="8" rx="10" ry="4" transform="rotate(-25 140 8)" fill="#e5b850" />
  </g>
  
</svg>