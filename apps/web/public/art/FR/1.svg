<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Vieux Lyon Cobblestone Street &amp; Traboule</title>
  <desc>Picturesque watercolor view of historic Vieux Lyon with its warm ochre and terracotta renaissance facades, stone traboule arched entrance, and bakery awning.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="lyon-facade-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfa07a" />
      <stop offset="100%" stop-color="#ba7048" />
    </linearGradient>
    <linearGradient id="lyon-facade-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecc67a" />
      <stop offset="100%" stop-color="#c99f4d" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Pastel Lyon sky between buildings -->
  <rect width="800" height="500" fill="#a3c4dc" />

  <!-- Left Renaissance Building (Warm Terracotta / Ochre) -->
  <polygon points="0,0 300,50 250,500 0,500" fill="url(#lyon-facade-left)" />
  <!-- Arched stone portal (Traboule Entrance) -->
  <path d="M120,500 L120,320 Q180,260 240,320 L240,500 Z" fill="#2d1c15" stroke="#995836" stroke-width="8" />
  <ellipse cx="180" cy="380" rx="30" ry="60" fill="#140a05" />

  <!-- Renaissance Mullioned Windows with green shutters -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="60" height="80" fill="#324036" />
    <!-- Shutters -->
    <rect x="-25" y="0" width="22" height="80" fill="#4d6955" />
    <rect x="63" y="0" width="22" height="80" fill="#4d6955" />
    <!-- Window panes cross -->
    <line x1="30" y1="0" x2="30" y2="80" stroke="#edd8c4" stroke-width="3" />
    <line x1="0" y1="40" x2="60" y2="40" stroke="#edd8c4" stroke-width="3" />
  </g>

  <!-- Right Renaissance Building (Golden Lyon Ochre) -->
  <polygon points="800,0 480,40 540,500 800,500" fill="url(#lyon-facade-right)" />
  <!-- Bakery Shopfront Awning on Right -->
  <polygon points="490,260 760,230 780,270 470,305" fill="#8c2f39" />
  <line x1="490" y1="260" x2="470" y2="305" stroke="#d5828b" stroke-width="20" stroke-dasharray="25,25" />

  <!-- Cobblestone Street Center -->
  <polygon points="250,500 540,500 440,350 340,350" fill="#9c958d" />
  <!-- Rounded paving stones -->
  <ellipse cx="390" cy="460" rx="18" ry="8" fill="#756f67" />
  <ellipse cx="430" cy="475" rx="20" ry="9" fill="#827c74" />
  <ellipse cx="360" cy="485" rx="22" ry="10" fill="#756f67" />

  <!-- Wrought Iron Street Lamp (Lanterne) hanging from wall -->
  <g transform="translate(300, 190)">
    <path d="M-40,0 Q-10,-20 20,-10 L20,30" fill="none" stroke="#222" stroke-width="4" />
    <!-- Lamp glass -->
    <polygon points="5,30 35,30 28,65 12,65" fill="#fdf0b5" stroke="#222" stroke-width="2" />
    <circle cx="20" cy="46" r="6" fill="#fff" filter="url(#soft-glow)" />
  </g>
  
</svg>