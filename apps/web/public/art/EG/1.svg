<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Khan el-Khalili Spice &amp; Lantern Souk</title>
  <desc>Vibrant watercolor atmosphere of Cairo&#x27;s historic bazaar with vaulted stone arches, glowing brass lanterns, and towering aromatic mounds of colorful spices.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="souk-arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d3527" />
      <stop offset="100%" stop-color="#2c1a11" />
    </linearGradient>
    <radialGradient id="souk-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffea9f" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f89d38" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3d1b0a" stop-opacity="0" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Stone arched vaulted alleyway -->
  <rect width="800" height="500" fill="#2d1c14" />
  
  <!-- Massive stone arch overhead -->
  <path d="M80,500 L80,240 Q400,60 720,240 L720,500 Z" fill="#3a261c" stroke="#52392b" stroke-width="12" />
  <circle cx="400" cy="240" r="280" fill="url(#souk-glow)" />

  <!-- Multi-colored hanging lanterns from arch -->
  <!-- Lantern 1 Left -->
  <g transform="translate(240, 160)">
    <line x1="0" y1="-80" x2="0" y2="0" stroke="#d4af37" stroke-width="2" />
    <polygon points="-20,0 0,-20 20,0 12,35 -12,35" fill="#f4a261" stroke="#8c5828" stroke-width="2" />
    <circle cx="0" cy="12" r="6" fill="#fff" />
  </g>
  <!-- Lantern 2 Center Grand -->
  <g transform="translate(400, 140)">
    <line x1="0" y1="-90" x2="0" y2="0" stroke="#d4af37" stroke-width="2.5" />
    <polygon points="-30,0 0,-25 30,0 20,45 -20,45" fill="#e76f51" stroke="#7a2a18" stroke-width="2" />
    <circle cx="0" cy="18" r="9" fill="#fffae6" filter="url(#soft-glow)" />
  </g>
  <!-- Lantern 3 Right -->
  <g transform="translate(560, 170)">
    <line x1="0" y1="-90" x2="0" y2="0" stroke="#d4af37" stroke-width="2" />
    <polygon points="-18,0 0,-18 18,0 12,32 -12,32" fill="#2a9d8f" stroke="#124842" stroke-width="2" />
    <circle cx="0" cy="10" r="5" fill="#fff" />
  </g>

  <!-- Market Spice Stall in foreground -->
  <path d="M100,340 L700,340 L740,500 L60,500 Z" fill="#5c3822" />

  <!-- Cones of vibrant spices -->
  <!-- Turmeric Gold -->
  <polygon points="160,430 210,310 260,430" fill="#f4b02a" />
  <ellipse cx="210" cy="430" rx="50" ry="18" fill="#d49013" />
  <!-- Paprika / Chili Red -->
  <polygon points="280,440 340,290 400,440" fill="#c42821" />
  <ellipse cx="340" cy="440" rx="60" ry="20" fill="#9b1b15" />
  <!-- Cumin Brown -->
  <polygon points="420,435 475,320 530,435" fill="#9c7849" />
  <ellipse cx="475" cy="435" rx="55" ry="19" fill="#75562e" />
  <!-- Hibiscus (Karkadeh) Deep Magenta -->
  <polygon points="550,440 600,335 650,440" fill="#6a1a2f" />
  <ellipse cx="600" cy="440" rx="50" ry="18" fill="#4a1120" />
  
</svg>