<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Felucca Sailing on the Golden Nile</title>
  <desc>Luminous watercolor sunset landscape of a traditional felucca gliding along the calm golden waters of the Nile with towering palms and flying river egrets.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="nile-sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b44b36" />
      <stop offset="40%" stop-color="#e37b42" />
      <stop offset="70%" stop-color="#f5b95b" />
      <stop offset="100%" stop-color="#fde08f" />
    </linearGradient>
    <linearGradient id="water-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e69848" />
      <stop offset="50%" stop-color="#c46a32" />
      <stop offset="100%" stop-color="#5a2d21" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Radiant Sunset Sky -->
  <rect width="800" height="280" fill="url(#nile-sunset)" />
  <!-- Glowing Sun sinking -->
  <circle cx="280" cy="200" r="50" fill="#fff9e6" />

  <!-- Riverbank silhouettes (Palms & Reeds) -->
  <path d="M0,265 Q200,250 500,260 T800,255 L800,285 L0,285 Z" fill="#4d2417" />
  <!-- Palm silhouettes -->
  <g fill="#33150d">
    <path d="M680,265 Q690,170 710,130 Q700,160 682,265 Z" />
    <path d="M710,130 Q660,110 635,130 Q670,135 710,130" />
    <path d="M710,130 Q730,95 765,115 Q735,125 710,130" />
    <path d="M710,130 Q685,90 705,80 Q715,105 710,130" />

    <path d="M740,265 Q745,185 760,150 Q750,175 742,265 Z" />
    <path d="M760,150 Q725,135 710,150 Q735,155 760,150" />
    <path d="M760,150 Q780,125 805,140 Q780,150 760,150" />
  </g>

  <!-- Golden Nile Waters -->
  <rect y="280" width="800" height="220" fill="url(#water-gold)" />
  <!-- Sun reflections -->
  <ellipse cx="280" cy="305" rx="70" ry="6" fill="#fff9e6" opacity="0.6" />
  <ellipse cx="280" cy="330" rx="110" ry="8" fill="#fde08f" opacity="0.5" />
  <ellipse cx="280" cy="365" rx="150" ry="9" fill="#f5b95b" opacity="0.4" />

  <!-- Centerstage Felucca -->
  <g transform="translate(240, 140)">
    <!-- Hull -->
    <path d="M0,170 Q70,195 160,170 Q180,155 185,145 Q80,150 0,170 Z" fill="#2d170f" />
    <!-- Mast -->
    <line x1="60" y1="160" x2="55" y2="70" stroke="#1f0f09" stroke-width="4" />
    <!-- Lateen Yard -->
    <line x1="15" y1="160" x2="115" y2="-40" stroke="#1f0f09" stroke-width="3" />
    <!-- Billowing White Sail -->
    <path d="M15,160 Q80,75 115,-40 Q85,45 60,160 Z" fill="#fffdf5" opacity="0.95" />
    <!-- Subtle shadow on sail -->
    <path d="M15,160 Q55,115 60,160 Z" fill="#edd6be" opacity="0.7" />
  </g>

  <!-- River birds (Egrets) in flight -->
  <path d="M140,80 Q150,70 160,80 Q170,70 180,80" stroke="#fff" stroke-width="2" fill="none" />
  <path d="M165,95 Q172,87 180,95 Q188,87 195,95" stroke="#fff" stroke-width="1.8" fill="none" />
  
</svg>