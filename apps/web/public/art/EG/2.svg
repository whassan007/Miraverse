<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Gathering Herbs &amp; Fava Beans</title>
  <desc>Watercolor composition of Egyptian market ingredients including an earthenware basin of dried golden fava beans, fresh fragrant coriander bundles, lemons, and garlic.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="market-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfcaa7" />
      <stop offset="100%" stop-color="#ab8f65" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="500" fill="#fdfbf5" />

  <!-- Sunlit market wood bench -->
  <rect y="200" width="800" height="300" fill="url(#market-wood)" />
  <line x1="0" y1="200" x2="800" y2="200" stroke="#7d6342" stroke-width="4" />

  <!-- Large terracotta bowl of dried fava beans (ful) -->
  <g transform="translate(180, 220)">
    <ellipse cx="80" cy="110" rx="90" ry="30" fill="#7a3e21" />
    <path d="M-10,30 Q80,180 170,30 Z" fill="#9e4e2a" />
    <ellipse cx="80" cy="30" rx="90" ry="25" fill="#bf6a3f" />
    <ellipse cx="80" cy="27" rx="82" ry="21" fill="#dfaa6f" />
    <!-- Individual fava beans -->
    <ellipse cx="50" cy="25" rx="9" ry="6" fill="#cda066" stroke="#aa7a41" />
    <ellipse cx="70" cy="20" rx="9" ry="6" transform="rotate(20 70 20)" fill="#eed29d" stroke="#aa7a41" />
    <ellipse cx="90" cy="28" rx="8" ry="6" transform="rotate(-15 90 28)" fill="#dcb378" stroke="#aa7a41" />
    <ellipse cx="110" cy="22" rx="9" ry="6" fill="#cda066" stroke="#aa7a41" />
  </g>

  <!-- Fresh leafy bundle of Coriander (Kizbara) and Parsley -->
  <g transform="translate(420, 180)">
    <!-- Twine wrap -->
    <rect x="75" y="160" width="30" height="15" fill="#a48455" />
    <!-- Stems -->
    <line x1="90" y1="160" x2="90" y2="220" stroke="#5d8234" stroke-width="6" />
    <line x1="80" y1="160" x2="70" y2="220" stroke="#5d8234" stroke-width="5" />
    <line x1="100" y1="160" x2="110" y2="220" stroke="#5d8234" stroke-width="5" />
    <!-- Lush frilly leaves -->
    <circle cx="60" cy="120" r="30" fill="#4d7c2a" opacity="0.85" />
    <circle cx="100" cy="100" r="35" fill="#5e9634" opacity="0.9" />
    <circle cx="120" cy="130" r="28" fill="#3b631d" opacity="0.8" />
    <circle cx="85" cy="80" r="30" fill="#72b043" opacity="0.85" />
  </g>

  <!-- Heads of Egyptian garlic & lemons -->
  <g transform="translate(620, 290)">
    <!-- Garlic Bulb 1 -->
    <circle cx="20" cy="50" r="24" fill="#faf6f0" stroke="#d5cbbe" stroke-width="2" />
    <path d="M12,28 Q20,12 28,28" stroke="#9d8f78" stroke-width="3" fill="none" />
    <!-- Lemons -->
    <ellipse cx="75" cy="60" rx="25" ry="18" fill="#f7d038" stroke="#d6ac13" stroke-width="1.5" />
    <ellipse cx="105" cy="65" rx="22" ry="16" transform="rotate(25 105 65)" fill="#fae05d" stroke="#d6ac13" stroke-width="1.5" />
  </g>
  
</svg>