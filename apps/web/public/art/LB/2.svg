<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Kneading Dough &amp; Wild Za&#x27;atar Prep</title>
  <desc>Sunlit Lebanese kitchen setting with a bowl of rising bread dough, olive wood rolling pin, and fresh wild thyme, sumac, and sesame seeds ready for manousheh.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="kitchen-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eddac2" />
      <stop offset="100%" stop-color="#d6be9f" />
    </linearGradient>
    <linearGradient id="counter-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfcfb8" />
      <stop offset="100%" stop-color="#b6a084" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Wall with arched stone window -->
  <rect width="800" height="500" fill="url(#kitchen-wall)" />
  
  <!-- Arched window showing mountain view -->
  <g transform="translate(480, 40)">
    <path d="M0,150 L0,220 L240,220 L240,150 A120,120 0 0,0 0,150 Z" fill="#9bc5db" />
    <!-- Distant hills through window -->
    <path d="M0,170 Q120,130 240,165 L240,220 L0,220 Z" fill="#7fa68b" />
    <!-- Window frame stone arch -->
    <path d="M-12,150 L-12,230 L252,230 L252,150 A132,132 0 0,0 -12,150 Z" fill="none" stroke="#aa9373" stroke-width="16" />
  </g>

  <!-- Wooden prep counter -->
  <rect x="0" y="260" width="800" height="240" fill="url(#counter-top)" />
  <line x1="0" y1="260" x2="800" y2="260" stroke="#8d775c" stroke-width="4" />

  <!-- Large terracotta mixing bowl with rising dough -->
  <g transform="translate(140, 200)">
    <!-- Terracotta bowl -->
    <path d="M20,90 Q120,220 220,90 Z" fill="#c4643b" />
    <ellipse cx="120" cy="90" rx="100" ry="25" fill="#ab512a" />
    <!-- Golden puffed yeast dough -->
    <ellipse cx="120" cy="85" rx="88" ry="26" fill="#f8e6c8" />
    <path d="M40,85 Q120,10 200,85 Z" fill="#faeed9" />
    <ellipse cx="120" cy="65" rx="60" ry="22" fill="#fef6eb" opacity="0.6" />
  </g>

  <!-- Rolling pin -->
  <g transform="translate(390, 310) rotate(-15)">
    <rect x="10" y="10" width="160" height="24" rx="12" fill="#a07248" />
    <rect x="-10" y="16" width="22" height="12" rx="4" fill="#784f2b" />
    <rect x="168" y="16" width="22" height="12" rx="4" fill="#784f2b" />
  </g>

  <!-- Wild Za'atar & spices on prep board -->
  <g transform="translate(480, 270)">
    <!-- Wooden cutting board -->
    <rect x="20" y="20" width="240" height="150" rx="8" fill="#bc9063" />
    <line x1="20" y1="30" x2="260" y2="30" stroke="#a07548" stroke-width="2" />
    
    <!-- Heap of crushed green wild thyme (za'atar) -->
    <ellipse cx="90" cy="90" rx="45" ry="25" fill="#3f5429" />
    <ellipse cx="90" cy="85" rx="35" ry="18" fill="#526d36" opacity="0.8" />
    <!-- sesame flecks -->
    <circle cx="80" cy="85" r="2" fill="#fffbe8" />
    <circle cx="95" cy="80" r="2" fill="#fffbe8" />
    <circle cx="105" cy="90" r="2" fill="#fffbe8" />

    <!-- Small dish of burgundy sumac powder -->
    <ellipse cx="180" cy="75" rx="28" ry="15" fill="#d1cfc7" />
    <ellipse cx="180" cy="73" rx="22" ry="11" fill="#7a1c2a" />

    <!-- Fresh sprigs of fresh wild thyme leaves -->
    <path d="M50,135 Q90,120 140,130" stroke="#485e2b" stroke-width="2.5" fill="none" />
    <ellipse cx="70" cy="126" rx="6" ry="3" transform="rotate(-15 70 126)" fill="#688241" />
    <ellipse cx="90" cy="124" rx="6" ry="3" transform="rotate(10 90 124)" fill="#688241" />
    <ellipse cx="115" cy="128" rx="6" ry="3" transform="rotate(-10 115 128)" fill="#688241" />
  </g>
  
</svg>