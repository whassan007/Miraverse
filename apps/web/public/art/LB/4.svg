<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Ancient Byblos Fishermen&#x27;s Port at Twilight</title>
  <desc>Atmospheric watercolor view of the historic medieval port of Byblos at sunset with tranquil waters, anchored fishing boats, and warm lantern reflections.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="twilight-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2747" />
      <stop offset="35%" stop-color="#3c3f6e" />
      <stop offset="70%" stop-color="#b66667" />
      <stop offset="90%" stop-color="#df8a5a" />
      <stop offset="100%" stop-color="#f5b974" />
    </linearGradient>
    <linearGradient id="twilight-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#343859" />
      <stop offset="50%" stop-color="#222b40" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="300" fill="url(#twilight-sky)" />
  <rect y="300" width="800" height="200" fill="url(#twilight-sea)" />

  <!-- Distant mountain silhouette -->
  <path d="M0,280 Q250,230 500,260 T800,250 L800,300 L0,300 Z" fill="#2d2b45" opacity="0.8" />

  <!-- Water reflections of sunset -->
  <polygon points="340,300 460,300 520,500 280,500" fill="#df8a5a" opacity="0.25" />
  <ellipse cx="400" cy="340" rx="90" ry="4" fill="#f5b974" opacity="0.4" />
  <ellipse cx="400" cy="370" rx="140" ry="5" fill="#df8a5a" opacity="0.3" />
  <ellipse cx="400" cy="410" rx="180" ry="6" fill="#f5b974" opacity="0.2" />

  <!-- Byblos Medieval Sea Tower Fort -->
  <g transform="translate(100, 180)">
    <polygon points="30,120 20,20 120,18 110,120" fill="#322c3d" />
    <rect x="20" y="10" width="18" height="12" fill="#322c3d" />
    <rect x="50" y="10" width="18" height="12" fill="#322c3d" />
    <rect x="80" y="10" width="18" height="12" fill="#322c3d" />
    <!-- Warm amber lantern window on tower -->
    <rect x="55" y="45" width="14" height="22" rx="7" fill="#ffb84d" filter="url(#soft-glow)" />
    <!-- Sea wall jetty -->
    <path d="M-40,120 C40,110 160,115 220,125 L210,150 L-40,150 Z" fill="#231f2b" />
  </g>

  <!-- Wooden fishing boats moored -->
  <g transform="translate(380, 320)">
    <!-- Boat 1 -->
    <path d="M0,35 Q60,55 120,35 Q135,15 140,5 Q70,10 0,35 Z" fill="#251a15" />
    <line x1="65" y1="35" x2="65" y2="-20" stroke="#3d291e" stroke-width="3" />
    <circle cx="65" cy="-10" r="5" fill="#ffb84d" filter="url(#soft-glow)" />
    <!-- Reflection in sea -->
    <path d="M10,40 Q60,55 110,40" stroke="#ffb84d" stroke-width="2" opacity="0.4" />
  </g>
  <g transform="translate(560, 340)">
    <!-- Boat 2 -->
    <path d="M0,30 Q45,46 95,30 Q105,12 110,5 Q55,10 0,30 Z" fill="#1b1412" />
    <line x1="50" y1="30" x2="50" y2="-10" stroke="#332117" stroke-width="2.5" />
  </g>

  <!-- Foreground pier edge with fishing net and ropes -->
  <path d="M0,450 Q300,430 800,460 L800,500 L0,500 Z" fill="#18151f" />
  <!-- Coiled mooring rope -->
  <ellipse cx="680" cy="470" rx="35" ry="15" fill="none" stroke="#63523d" stroke-width="6" />
  <ellipse cx="680" cy="470" rx="25" ry="10" fill="none" stroke="#7a654c" stroke-width="5" />
  
</svg>