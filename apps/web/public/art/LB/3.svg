<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Baking on the Traditional Lebanese Saj</title>
  <desc>Close-up dramatic watercolor illustration of golden dough bubbling on the curved iron dome of the saj oven over red-hot charcoal embers.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="hearth-heat" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffb142" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ff521a" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#801c0c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2d150f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="charcoal-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="25%" stop-color="#ff9900" />
      <stop offset="70%" stop-color="#cc2200" />
      <stop offset="100%" stop-color="#260803" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Dark cozy stone chamber backdrop -->
  <rect width="800" height="500" fill="#231d19" />
  
  <!-- Glowing hearth aura -->
  <circle cx="400" cy="270" r="320" fill="url(#hearth-heat)" />

  <!-- Stone hearth masonry base -->
  <path d="M120,480 L180,300 L620,300 L680,480 Z" fill="#42372f" />
  <!-- Hearth opening -->
  <ellipse cx="400" cy="380" rx="160" ry="70" fill="#1b120c" />
  <!-- Glowing charcoal bed -->
  <ellipse cx="400" cy="390" rx="130" ry="45" fill="url(#charcoal-glow)" />
  <circle cx="360" cy="385" r="14" fill="#ffea88" />
  <circle cx="430" cy="392" r="12" fill="#ffb84d" />
  <circle cx="390" cy="405" r="15" fill="#ff6611" />

  <!-- The Domed Saj -->
  <ellipse cx="400" cy="250" rx="240" ry="110" fill="#1f2224" />
  <ellipse cx="400" cy="245" rx="234" ry="104" fill="#2d3238" />
  <ellipse cx="400" cy="240" rx="226" ry="98" fill="#181a1c" />

  <!-- Large bubbling Manousheh -->
  <ellipse cx="400" cy="235" rx="170" ry="72" fill="#eed5a4" />
  <!-- Blistered za'atar patches -->
  <path d="M280,230 Q330,195 440,205 Q520,215 510,250 Q430,270 330,260 Z" fill="#364923" opacity="0.9" />
  <!-- Bubble blisters -->
  <ellipse cx="340" cy="225" rx="14" ry="8" fill="#80551e" opacity="0.8" />
  <ellipse cx="450" cy="220" rx="18" ry="9" fill="#754b17" opacity="0.8" />
  <ellipse cx="400" cy="250" rx="12" ry="6" fill="#80551e" opacity="0.8" />
  <!-- Sesame toppings -->
  <circle cx="320" cy="235" r="3" fill="#fff8db" />
  <circle cx="370" cy="215" r="3" fill="#fff8db" />
  <circle cx="425" cy="235" r="3" fill="#fff8db" />
  <circle cx="470" cy="225" r="3" fill="#fff8db" />

  <!-- Rich billowing steam swirls -->
  <g opacity="0.6">
    <path d="M340,190 Q320,130 360,80 Q390,40 370,10" stroke="#fcefdc" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M430,185 Q460,120 420,75 Q390,35 420,10" stroke="#fcefdc" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M390,190 Q380,140 405,95 Q420,60 400,20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>
  
</svg>