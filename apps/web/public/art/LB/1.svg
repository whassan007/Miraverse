<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Mount Lebanon Olive Terraces &amp; Harvest</title>
  <desc>Watercolor scene of sunlit mountain terraces in Lebanon with ancient olive trees, stone farm house, and wicker baskets brimming with freshly picked olives.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="sky-terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79a8c7" />
      <stop offset="60%" stop-color="#c6dbe8" />
      <stop offset="100%" stop-color="#faebd7" />
    </linearGradient>
    <linearGradient id="terrace-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b09c7a" />
      <stop offset="100%" stop-color="#806d50" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="250" fill="url(#sky-terrace)" />
  <!-- Mountains -->
  <path d="M0,180 Q200,90 400,160 T800,140 L800,300 L0,300 Z" fill="#8ca699" opacity="0.6" />
  <path d="M0,210 Q250,150 500,200 T800,180 L800,350 L0,350 Z" fill="#6d8a7c" opacity="0.75" />

  <!-- Terraces -->
  <path d="M0,270 Q400,240 800,270 L800,310 Q400,285 0,310 Z" fill="url(#terrace-soil)" />
  <path d="M0,305 Q380,280 800,305 L800,320 Q380,295 0,320 Z" fill="#5e503b" />
  
  <path d="M0,320 Q400,295 800,320 L800,370 Q400,345 0,370 Z" fill="url(#terrace-soil)" />
  <path d="M0,365 Q380,340 800,365 L800,380 Q380,355 0,380 Z" fill="#5e503b" />

  <path d="M0,380 Q400,355 800,380 L800,500 L0,500 Z" fill="#a48f6c" />

  <!-- Stone House on Ridge -->
  <g transform="translate(560, 160)">
    <polygon points="20,50 60,20 100,50" fill="#a84332" />
    <rect x="25" y="50" width="70" height="45" fill="#e6d7c1" />
    <rect x="40" y="60" width="12" height="18" rx="6" fill="#4d3e2d" />
    <rect x="65" y="60" width="12" height="18" rx="6" fill="#4d3e2d" />
  </g>

  <!-- Olive Trees -->
  <g transform="translate(180, 200)">
    <path d="M50,110 Q45,70 30,50 Q40,30 25,10" stroke="#5a4231" stroke-width="12" fill="none" stroke-linecap="round" />
    <ellipse cx="20" cy="20" rx="55" ry="35" fill="#697a55" opacity="0.9" />
    <ellipse cx="40" cy="5" rx="45" ry="30" fill="#7f9368" opacity="0.85" />
    <ellipse cx="-5" cy="30" rx="35" ry="25" fill="#556444" opacity="0.9" />
  </g>
  <g transform="translate(420, 240)">
    <path d="M40,110 Q50,70 35,45 Q50,30 40,10" stroke="#5a4231" stroke-width="14" fill="none" stroke-linecap="round" />
    <ellipse cx="40" cy="15" rx="65" ry="40" fill="#697a55" opacity="0.9" />
    <ellipse cx="65" cy="-5" rx="50" ry="35" fill="#7f9368" opacity="0.85" />
    <ellipse cx="10" cy="25" rx="40" ry="30" fill="#556444" opacity="0.9" />
  </g>

  <!-- Olive Harvest Baskets in Foreground -->
  <g transform="translate(120, 360)">
    <!-- Woven wicker basket -->
    <ellipse cx="60" cy="50" rx="45" ry="12" fill="#80562e" />
    <path d="M15,50 C18,85 30,110 60,110 C90,110 102,85 105,50 Z" fill="#9b6c3d" />
    <path d="M15,50 C20,70 40,85 60,85 C80,85 100,70 105,50" stroke="#714c27" stroke-width="3" fill="none" />
    <!-- Olives mounded in basket -->
    <ellipse cx="60" cy="46" rx="42" ry="14" fill="#3a402e" />
    <circle cx="45" cy="42" r="5" fill="#4d5930" />
    <circle cx="55" cy="38" r="5.5" fill="#2d2232" />
    <circle cx="68" cy="40" r="5" fill="#4d5930" />
    <circle cx="78" cy="44" r="5.5" fill="#2d2232" />
    <circle cx="50" cy="49" r="4.5" fill="#2d2232" />
    <circle cx="62" cy="47" r="5" fill="#5e7036" />
    <!-- Olive branches spilling over -->
    <path d="M75,45 Q115,55 125,75" stroke="#4d5930" stroke-width="2" fill="none" />
    <ellipse cx="100" cy="58" rx="7" ry="3.5" transform="rotate(15 100 58)" fill="#7f9368" />
    <ellipse cx="118" cy="68" rx="7" ry="3.5" transform="rotate(25 118 68)" fill="#697a55" />
  </g>
  
</svg>