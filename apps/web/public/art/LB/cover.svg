<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Byblos Harbour &amp; Traditional Lebanese Saj</title>
  <desc>Watercolor illustration of ancient Byblos harbour at sunset with crusader castle, wooden fishing boat, and a warm domed saj baking fresh zaatar flatbread.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="lb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7c9f" />
      <stop offset="40%" stop-color="#a4c2d4" />
      <stop offset="70%" stop-color="#f5d6ba" />
      <stop offset="100%" stop-color="#f8e5c8" />
    </linearGradient>
    <linearGradient id="lb-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6f86" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3b8ea5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1f5268" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fedc8c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f8e5c8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="saj-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3033" />
      <stop offset="45%" stop-color="#1e2022" />
      <stop offset="85%" stop-color="#151719" />
      <stop offset="100%" stop-color="#3d4349" />
    </linearGradient>
    <radialGradient id="ember-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff7a18" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#d9381e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#80180a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bread-grad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#f7deb2" />
      <stop offset="50%" stop-color="#edd19a" />
      <stop offset="100%" stop-color="#d4b476" />
    </linearGradient>
    <linearGradient id="stone-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d8be" />
      <stop offset="100%" stop-color="#baa788" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="320" fill="url(#lb-sky)" />
  <circle cx="220" cy="180" r="140" fill="url(#sun-glow)" />

  <!-- Mount Lebanon backdrop -->
  <path d="M0,230 Q120,180 260,205 T540,195 Q680,185 800,210 L800,320 L0,320 Z" fill="#6c8f94" opacity="0.45" />
  <path d="M0,250 Q160,210 340,235 T670,225 Q740,220 800,240 L800,340 L0,340 Z" fill="#587e7a" opacity="0.6" />
  
  <!-- Mediterranean Sea -->
  <rect x="0" y="270" width="800" height="150" fill="url(#lb-sea)" />
  <ellipse cx="280" cy="290" rx="160" ry="12" fill="#fff" opacity="0.25" />
  <ellipse cx="240" cy="305" rx="100" ry="8" fill="#fff" opacity="0.18" />

  <!-- Byblos Crusader Castle Tower & Harbour Wall -->
  <g id="byblos-tower">
    <polygon points="120,290 115,190 185,188 180,290" fill="url(#stone-grad)" />
    <!-- battlements -->
    <rect x="115" y="184" width="14" height="10" fill="#baa788" />
    <rect x="135" y="184" width="14" height="10" fill="#baa788" />
    <rect x="155" y="184" width="14" height="10" fill="#baa788" />
    <rect x="173" y="184" width="12" height="10" fill="#baa788" />
    <!-- stone texture & window -->
    <rect x="144" y="210" width="8" height="16" rx="4" fill="#3c3429" opacity="0.8" />
    <line x1="120" y1="230" x2="182" y2="229" stroke="#9d8b72" stroke-width="2" opacity="0.5" />
    <line x1="118" y1="260" x2="181" y2="259" stroke="#9d8b72" stroke-width="2" opacity="0.5" />
    <!-- Sea breakwater jetty -->
    <path d="M80,295 C120,290 200,292 230,298 C225,310 110,315 70,305 Z" fill="#9d8b72" opacity="0.9" />
  </g>

  <!-- Traditional wooden fishing boat (faluka) -->
  <g id="boat" transform="translate(230, 290)">
    <path d="M0,15 Q35,28 75,18 Q90,5 95,0 Q45,2 0,15 Z" fill="#5c3826" />
    <path d="M10,14 Q40,24 75,15" stroke="#3b2114" stroke-width="2" fill="none" />
    <line x1="45" y1="18" x2="45" y2="-15" stroke="#6b4423" stroke-width="2" />
    <!-- wrapped sail -->
    <path d="M46,-12 Q60,-4 70,8 Q55,4 46,0 Z" fill="#f4ebd9" opacity="0.85" />
  </g>

  <!-- Foreground Terrace & Wall -->
  <path d="M0,350 Q300,340 800,360 L800,500 L0,500 Z" fill="#d8c5a4" />
  <path d="M0,365 Q400,355 800,375 L800,500 L0,500 Z" fill="#cbb38e" opacity="0.7" />

  <!-- Saj Oven -->
  <g id="saj-station" transform="translate(480, 290)">
    <!-- Charcoal embers under the dome -->
    <circle cx="140" cy="140" r="60" fill="url(#ember-glow)" />
    <!-- Hearth stone base -->
    <path d="M60,150 Q140,135 220,150 L230,195 Q140,205 50,195 Z" fill="#5a4e40" />
    <ellipse cx="140" cy="155" rx="80" ry="12" fill="#383027" />

    <!-- Convex dome of the Saj -->
    <ellipse cx="140" cy="115" rx="85" ry="42" fill="url(#saj-grad)" />
    <!-- Saj metallic rim highlight -->
    <ellipse cx="140" cy="114" rx="83" ry="39" fill="none" stroke="#717a82" stroke-width="2.5" opacity="0.7" />

    <!-- Baking Manousheh flatbread with za'atar -->
    <ellipse cx="140" cy="110" rx="65" ry="28" fill="url(#bread-grad)" />
    <!-- Za'atar topping (thyme, sesame, olive oil dots) -->
    <path d="M95,108 C105,95 135,92 170,98 C195,102 190,118 175,124 C140,132 110,126 95,108 Z" fill="#3f532a" opacity="0.9" />
    <!-- Sesame seed flecks and blistering dots -->
    <circle cx="120" cy="105" r="2.5" fill="#f2f5d0" />
    <circle cx="145" cy="100" r="2.5" fill="#f2f5d0" />
    <circle cx="165" cy="112" r="2" fill="#f2f5d0" />
    <circle cx="135" cy="118" r="2.5" fill="#f2f5d0" />
    <circle cx="155" cy="115" r="2.5" fill="#5c441b" />
    <circle cx="115" cy="115" r="3" fill="#5c441b" />
    
    <!-- Steam curls -->
    <path d="M125,90 Q120,70 130,55 Q140,40 135,25" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
    <path d="M150,88 Q158,68 152,50 Q146,35 152,20" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round" />
  </g>

  <!-- Fresh wild thyme (za'atar) branch & olive oil cruet in foreground -->
  <g id="table-props" transform="translate(140, 390)">
    <!-- Terracotta olive oil jug -->
    <path d="M80,30 C65,30 55,50 55,75 C55,90 65,95 80,95 C95,95 105,90 105,75 C105,50 95,30 80,30 Z" fill="#b85f39" />
    <ellipse cx="80" cy="30" rx="10" ry="4" fill="#a04d2a" />
    <path d="M88,40 Q105,50 98,70" stroke="#883d1c" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- Olive sprig -->
    <path d="M140,85 Q170,60 210,65" stroke="#4d5930" stroke-width="2.5" fill="none" />
    <ellipse cx="160" cy="70" rx="8" ry="4" transform="rotate(-20 160 70)" fill="#687c3c" />
    <ellipse cx="185" cy="62" rx="8" ry="4" transform="rotate(10 185 62)" fill="#5e7036" />
    <ellipse cx="205" cy="66" rx="7" ry="4" transform="rotate(-15 205 66)" fill="#687c3c" />
    <!-- Ripe purple olives -->
    <circle cx="168" cy="77" r="4.5" fill="#3d2a3e" />
    <circle cx="192" cy="71" r="4" fill="#2d2232" />
  </g>
  
</svg>