<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Warm Lebanese Mezze Feast with Fresh Manousheh</title>
  <desc>Generous family dining table spread with freshly baked manousheh, creamy labneh swirled with olive oil, garden tomatoes, crisp cucumbers, and fragrant mint tea.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="warm-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c2419" />
      <stop offset="60%" stop-color="#583927" />
      <stop offset="100%" stop-color="#734d35" />
    </linearGradient>
    <radialGradient id="overhead-lantern" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#fdb85b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#734d35" stop-opacity="0" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="500" fill="url(#warm-room)" />
  <rect width="800" height="500" fill="url(#overhead-lantern)" />

  <!-- Hanging decorative brass lamp -->
  <g transform="translate(400, 0)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#8a6c38" stroke-width="2.5" />
    <polygon points="-25,90 0,60 25,90 0,115" fill="#d4af37" />
    <circle cx="0" cy="90" r="12" fill="#fff" filter="url(#soft-glow)" />
  </g>

  <!-- Big round wooden dining table -->
  <ellipse cx="400" cy="380" rx="360" ry="150" fill="#a46d3e" stroke="#6e4521" stroke-width="8" />

  <!-- Centerpiece: Platter of warm folded za'atar manousheh -->
  <g transform="translate(400, 360)">
    <!-- Ceramic platter -->
    <ellipse cx="0" cy="0" rx="140" ry="55" fill="#fdfbf7" stroke="#d5cebe" stroke-width="3" />
    <!-- Folded half-moon manousheh 1 -->
    <path d="M-80,-10 C-50,-35 40,-35 70,-10 C30,15 -40,15 -80,-10 Z" fill="#f1d69d" stroke="#cfa861" stroke-width="2" />
    <path d="M-60,-12 C-30,-28 30,-28 50,-12 C20,2 -30,2 -60,-12 Z" fill="#435928" opacity="0.9" />
    <!-- Folded manousheh 2 -->
    <path d="M-50,10 C-20,-15 70,-15 90,10 C60,30 -10,30 -50,10 Z" fill="#e6c483" stroke="#cfa861" stroke-width="2" />
    <path d="M-30,8 C-5,-8 60,-8 75,8 C45,20 0,20 -30,8 Z" fill="#3a4f21" opacity="0.9" />
  </g>

  <!-- Side dishes: Labneh with olive oil swirl -->
  <g transform="translate(180, 340)">
    <ellipse cx="0" cy="0" rx="55" ry="25" fill="#fcfbf9" stroke="#d2c8b8" stroke-width="2" />
    <ellipse cx="0" cy="-2" rx="46" ry="19" fill="#fdfdfc" />
    <!-- Olive oil swirl -->
    <path d="M-25,-3 Q0,-12 25,-4 Q15,8 -10,6" fill="none" stroke="#c29b27" stroke-width="4" stroke-linecap="round" />
    <!-- Mint leaf on labneh -->
    <ellipse cx="0" cy="-3" rx="7" ry="4" fill="#4d7c2a" />
  </g>

  <!-- Fresh vegetables plate (cucumbers, tomatoes, olives) -->
  <g transform="translate(620, 345)">
    <ellipse cx="0" cy="0" rx="60" ry="28" fill="#fcfbf9" stroke="#d2c8b8" stroke-width="2" />
    <!-- Tomato wedges -->
    <path d="M-30,-5 Q-15,-18 -5,-5 Z" fill="#d93829" />
    <path d="M-5,-5 Q10,-18 20,-5 Z" fill="#d93829" />
    <!-- Cucumber slices -->
    <ellipse cx="-15" cy="5" rx="10" ry="6" fill="#80a84e" stroke="#486e24" stroke-width="1.5" />
    <ellipse cx="10" cy="6" rx="10" ry="6" fill="#80a84e" stroke="#486e24" stroke-width="1.5" />
    <!-- Black olives -->
    <circle cx="28" cy="-2" r="5" fill="#2d2232" />
    <circle cx="32" cy="6" r="4.5" fill="#2d2232" />
  </g>

  <!-- Lebanese Mint Tea Glasses -->
  <g transform="translate(290, 420)">
    <!-- Small clear tea glass -->
    <ellipse cx="0" cy="18" rx="14" ry="6" fill="#baa48b" />
    <path d="M-12,0 L-8,18 L8,18 L12,0 Z" fill="#a83c18" opacity="0.8" stroke="#eed8be" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#d86326" opacity="0.8" />
    <!-- Mint sprig inside -->
    <line x1="0" y1="8" x2="3" y2="-6" stroke="#4a7c29" stroke-width="2" />
    <ellipse cx="3" cy="-6" rx="5" ry="3" fill="#67a13d" />
  </g>
  <g transform="translate(510, 420)">
    <ellipse cx="0" cy="18" rx="14" ry="6" fill="#baa48b" />
    <path d="M-12,0 L-8,18 L8,18 L12,0 Z" fill="#a83c18" opacity="0.8" stroke="#eed8be" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#d86326" opacity="0.8" />
    <line x1="0" y1="8" x2="-2" y2="-6" stroke="#4a7c29" stroke-width="2" />
    <ellipse cx="-2" cy="-6" rx="5" ry="3" fill="#67a13d" />
  </g>
  
</svg>