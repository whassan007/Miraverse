<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Chuseok Family Feast on the Hanok Veranda</title>
  <desc>Warm family table set upon a polished hanok veranda featuring a sizzling stone bibimbap bowl, bronze sujeo utensils, fresh kimchi, seasoned lotus roots, and fragrant barley tea.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="maru-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#805333" />
      <stop offset="50%" stop-color="#99633e" />
      <stop offset="100%" stop-color="#73492c" />
    </linearGradient>
    <radialGradient id="brass-shine" cx="0.4" cy="0.3" r="0.65">
      <stop offset="0%" stop-color="#fff8cc" />
      <stop offset="50%" stop-color="#e0b84c" />
      <stop offset="100%" stop-color="#8f6e1d" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Polished wooden veranda floor (Toenmaru) -->
  <rect width="800" height="500" fill="url(#maru-wood)" />
  <line x1="0" y1="120" x2="800" y2="120" stroke="#5a381f" stroke-width="4" />
  <line x1="0" y1="240" x2="800" y2="240" stroke="#5a381f" stroke-width="4" />
  <line x1="0" y1="360" x2="800" y2="360" stroke="#5a381f" stroke-width="4" />

  <!-- Low Lacquered Dining Table (Soban) -->
  <ellipse cx="400" cy="340" rx="360" ry="140" fill="#361f14" stroke="#24130b" stroke-width="8" />

  <!-- Center Main: Sizzling Stone Bibimbap Bowl -->
  <g transform="translate(400, 310)">
    <ellipse cx="0" cy="0" rx="90" ry="42" fill="#1b1c1e" stroke="#3b3f47" stroke-width="3" />
    <ellipse cx="0" cy="-3" rx="82" ry="36" fill="#f8f4ed" />
    <!-- Vibrant toppings radiating -->
    <path d="M0,-3 L-55,-20 C-40,-35 0,-38 25,-30 Z" fill="#4d7c38" />
    <path d="M0,-3 L25,-30 C50,-20 65,-5 60,15 Z" fill="#f77f00" />
    <path d="M0,-3 L60,15 C50,30 20,38 -15,35 Z" fill="#693b21" />
    <path d="M0,-3 L-15,35 C-45,30 -65,15 -60,-5 Z" fill="#eae2b7" />
    <!-- Egg yolk center -->
    <circle cx="0" cy="-3" r="14" fill="#ffb703" />
    <!-- Steam -->
    <path d="M-10,-40 Q-20,-70 -5,-95" stroke="#fff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Korean Bronze Spoon & Chopsticks (Sujeo) -->
  <g transform="translate(560, 340)">
    <!-- Bronze Spoon -->
    <ellipse cx="-20" cy="-20" rx="12" ry="16" fill="url(#brass-shine)" />
    <line x1="-20" y1="-5" x2="-20" y2="85" stroke="url(#brass-shine)" stroke-width="4" stroke-linecap="round" />
    <!-- Bronze Chopsticks -->
    <line x1="5" y1="-30" x2="5" y2="85" stroke="url(#brass-shine)" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="-30" x2="16" y2="85" stroke="url(#brass-shine)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Side Dishes (Banchan) -->
  <!-- Kimchi (White Porcelain Bowl Left) -->
  <g transform="translate(230, 290)">
    <ellipse cx="0" cy="0" rx="45" ry="22" fill="#fcfbfa" stroke="#d5cbbe" stroke-width="2" />
    <ellipse cx="0" cy="-2" rx="38" ry="16" fill="#c1292e" />
    <ellipse cx="-8" cy="-4" rx="14" ry="7" fill="#e63946" />
  </g>

  <!-- Seasoned Lotus Root (Yeongeun-jorim) (Celadon Bowl Right) -->
  <g transform="translate(570, 260)">
    <ellipse cx="0" cy="0" rx="42" ry="20" fill="#d8e2dc" stroke="#9bb1a3" stroke-width="2" />
    <ellipse cx="-10" cy="-2" rx="14" ry="8" fill="#58311a" />
    <ellipse cx="10" cy="-1" rx="14" ry="8" fill="#6d3d22" />
    <!-- Lotus holes -->
    <circle cx="-10" cy="-2" r="2" fill="#d8e2dc" />
    <circle cx="10" cy="-1" r="2" fill="#d8e2dc" />
  </g>

  <!-- Roasted Barley Tea (Boricha) in Brass Cup -->
  <g transform="translate(210, 390)">
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="url(#brass-shine)" />
    <path d="M-24,0 L-18,30 L18,30 L24,0 Z" fill="url(#brass-shine)" />
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="#a0632b" />
  </g>
  
</svg>