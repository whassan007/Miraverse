<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Jeonju Hanok &amp; Autumn Harvest Moon</title>
  <desc>Poetic watercolor painting of a traditional Jeonju hanok with curved dark-tiled eaves and glowing paper-screened doors beneath a luminous golden Chuseok full moon.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="kr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="40%" stop-color="#2a3b68" />
      <stop offset="80%" stop-color="#4d628f" />
      <stop offset="100%" stop-color="#90a2c0" />
    </linearGradient>
    <radialGradient id="harvest-moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffaeb" />
      <stop offset="45%" stop-color="#fde49e" />
      <stop offset="80%" stop-color="#f6ca68" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f6ca68" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paper-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5db" />
      <stop offset="100%" stop-color="#fad074" />
    </linearGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Night Sky -->
  <rect width="800" height="500" fill="url(#kr-sky)" />

  <!-- Luminous Autumn Full Harvest Moon (Chuseok Moon) -->
  <circle cx="260" cy="150" r="95" fill="url(#harvest-moon)" />
  <circle cx="260" cy="150" r="75" fill="#fffdf5" />
  <!-- Subtle lunar maria watercolor patches -->
  <path d="M230,130 Q250,115 270,135 Q290,140 280,165 Q250,180 230,155 Z" fill="#fae8b4" opacity="0.35" />

  <!-- Distant misty Korean mountain ridges -->
  <path d="M0,280 Q200,230 450,260 T800,240 L800,380 L0,380 Z" fill="#202e52" opacity="0.75" />
  <path d="M0,310 Q280,260 550,290 T800,280 L800,420 L0,420 Z" fill="#18233f" opacity="0.9" />

  <!-- Traditional Korean Pine Branches (Sonamu) framing the moon -->
  <g stroke="#1a251b" fill="none">
    <path d="M0,100 Q80,120 160,80 Q210,60 250,90" stroke-width="8" stroke-linecap="round" />
    <path d="M120,95 Q140,50 170,40" stroke-width="5" stroke-linecap="round" />
    <!-- Pine needle clusters -->
    <ellipse cx="170" cy="40" rx="30" ry="15" fill="#2d422a" stroke="none" opacity="0.85" />
    <ellipse cx="250" cy="90" rx="35" ry="18" fill="#243821" stroke="none" opacity="0.9" />
    <ellipse cx="140" cy="100" rx="28" ry="14" fill="#324b2f" stroke="none" opacity="0.85" />
  </g>

  <!-- Jeonju Hanok Architecture -->
  <g transform="translate(340, 160)">
    <!-- Hanok Sweeping Giwa Tiled Roof -->
    <!-- Upward curved eave profile -->
    <path d="M-60,110 Q140,40 440,80 L460,95 Q140,65 -50,130 Z" fill="#222831" />
    <!-- Roof ridge (Yongmaru) -->
    <path d="M-50,105 Q140,35 440,75 L435,65 Q140,25 -45,95 Z" fill="#393e46" />
    <!-- Underside wooden rafters (Cheoma) -->
    <path d="M-40,125 Q140,75 430,95 L420,115 Q140,95 -30,140 Z" fill="#5c3d28" />

    <!-- Hanok Wooden Frame & Warm Glowing Changhoji Paper Screen Doors -->
    <!-- Pillars -->
    <rect x="0" y="130" width="18" height="150" fill="#4d3220" />
    <rect x="130" y="120" width="16" height="160" fill="#4d3220" />
    <rect x="260" y="110" width="16" height="170" fill="#4d3220" />
    <rect x="380" y="100" width="18" height="180" fill="#4d3220" />

    <!-- Screen Door 1 -->
    <rect x="18" y="135" width="112" height="135" fill="url(#paper-screen)" />
    <!-- Lattice woodwork (Changsal) -->
    <line x1="74" y1="135" x2="74" y2="270" stroke="#7a5532" stroke-width="3" />
    <line x1="18" y1="180" x2="130" y2="180" stroke="#7a5532" stroke-width="2" />
    <line x1="18" y1="225" x2="130" y2="225" stroke="#7a5532" stroke-width="2" />

    <!-- Screen Door 2 -->
    <rect x="146" y="125" width="114" height="145" fill="url(#paper-screen)" />
    <line x1="203" y1="125" x2="203" y2="270" stroke="#7a5532" stroke-width="3" />
    <line x1="146" y1="170" x2="260" y2="170" stroke="#7a5532" stroke-width="2" />
    <line x1="146" y1="220" x2="260" y2="220" stroke="#7a5532" stroke-width="2" />

    <!-- Wooden Veranda (Toenmaru) Floor & Stone Foundation -->
    <polygon points="-30,270 410,270 400,295 -40,295" fill="#694326" />
    <polygon points="-40,295 400,295 390,340 -50,340" fill="#5a5e65" />
  </g>

  <!-- Autumn Crimson & Gold Maple Leaves (Danpung) Drifting -->
  <g fill="#c93b2b">
    <ellipse cx="140" cy="320" rx="8" ry="5" transform="rotate(35 140 320)" />
    <ellipse cx="220" cy="360" rx="7" ry="4" transform="rotate(-20 220 360)" fill="#e76f51" />
    <ellipse cx="310" cy="390" rx="9" ry="5" transform="rotate(45 310 390)" fill="#d94f26" />
    <ellipse cx="180" cy="420" rx="8" ry="4" transform="rotate(-15 180 420)" fill="#f4a261" />
  </g>
  
</svg>