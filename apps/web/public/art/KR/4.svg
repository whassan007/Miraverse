<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Harvest Moon Over Mountain Pavilion</title>
  <desc>Moonlit landscape of a glowing autumn full moon reflected in a calm lotus pond, with a traditional mountain pavilion and an elegant red-crowned crane soaring past.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="night-lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182345" />
      <stop offset="50%" stop-color="#0f162c" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <radialGradient id="silver-moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffdf7" />
      <stop offset="50%" stop-color="#f5e6b8" />
      <stop offset="90%" stop-color="#dbc27d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#dbc27d" stop-opacity="0" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Night Sky -->
  <rect width="800" height="300" fill="#0d142b" />
  
  <!-- Glowing Full Moon -->
  <circle cx="400" cy="110" r="100" fill="url(#silver-moon)" />
  <circle cx="400" cy="110" r="55" fill="#fffef7" />

  <!-- Mountain Silhouettes -->
  <path d="M0,260 Q200,180 400,240 T800,200 L800,300 L0,300 Z" fill="#1c2747" opacity="0.8" />
  <path d="M0,280 Q250,220 500,270 T800,250 L800,310 L0,310 Z" fill="#11192e" />

  <!-- Tranquil Lotus Pond -->
  <rect y="300" width="800" height="200" fill="url(#night-lake)" />
  <!-- Moon shimmer reflection on water -->
  <ellipse cx="400" cy="330" rx="30" ry="4" fill="#fffef7" opacity="0.6" />
  <ellipse cx="400" cy="360" rx="55" ry="5" fill="#f5e6b8" opacity="0.5" />
  <ellipse cx="400" cy="400" rx="90" ry="6" fill="#dbc27d" opacity="0.35" />
  <ellipse cx="400" cy="450" rx="130" ry="7" fill="#dbc27d" opacity="0.2" />

  <!-- Traditional Korean Mountain Pavilion (Jeongja) on Promontory -->
  <g transform="translate(120, 160)">
    <!-- Pavilion Stone Platform -->
    <polygon points="10,140 150,140 160,170 0,170" fill="#2d3545" />
    <!-- Pillars -->
    <rect x="25" y="65" width="8" height="75" fill="#543d2b" />
    <rect x="65" y="65" width="8" height="75" fill="#543d2b" />
    <rect x="105" y="65" width="8" height="75" fill="#543d2b" />
    <rect x="135" y="65" width="8" height="75" fill="#543d2b" />
    <!-- Balustrade railing -->
    <line x1="15" y1="115" x2="145" y2="115" stroke="#7a5538" stroke-width="3" />
    <!-- Upturned Korean Curved Roof -->
    <path d="M-10,65 Q80,25 180,60 L185,50 Q80,10 -15,55 Z" fill="#141924" />
  </g>

  <!-- Flying Red-Crowned Crane (Durumi) Silhouette -->
  <g transform="translate(560, 90)">
    <path d="M0,20 Q20,10 40,18 Q30,22 15,25 Z" fill="#ffffff" opacity="0.9" />
    <!-- Black wing tips -->
    <polygon points="35,16 48,12 40,24" fill="#141414" />
    <!-- Elegant neck and beak -->
    <path d="M0,20 Q-15,18 -25,12" stroke="#ffffff" stroke-width="2" fill="none" />
    <!-- Red crown dot -->
    <circle cx="-20" cy="14" r="2.5" fill="#d90429" />
    <!-- Trailing legs -->
    <line x1="30" y1="22" x2="55" y2="28" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Floating Lotus Leaves on Pond -->
  <ellipse cx="640" cy="380" rx="35" ry="12" fill="#1e382b" />
  <ellipse cx="300" cy="430" rx="42" ry="14" fill="#224233" />
  <ellipse cx="230" cy="450" rx="28" ry="10" fill="#1a3327" />
  
</svg>