<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 752" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Halos & Gradients -->
    <radialGradient id="eg-halo-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#FFB300" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="eg-halo-ruby" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A80" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#E53935" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#B71C1C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="eg-halo-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7FFEB" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#00BFA5" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#004D40" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="eg-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6421" />
    </linearGradient>

    <linearGradient id="eg-nile-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFD54F" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#FFF8E1" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#FFD54F" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="eg-arch-trim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <!-- Reusable 12-Point Khayamiya Star Medallion -->
    <g id="khayamiya-medallion">
      <circle cx="0" cy="0" r="56" stroke="#FFD54F" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.38" />
      <circle cx="0" cy="0" r="44" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.45" />
      <!-- 4 rotated squares creating a 12-point Islamic star -->
      <rect x="-30" y="-30" width="60" height="60" stroke="#FFE082" stroke-width="1.2" stroke-opacity="0.42" fill="#FFD54F" fill-opacity="0.03" />
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(30)" stroke="#FFE082" stroke-width="1.2" stroke-opacity="0.42" fill="#FFD54F" fill-opacity="0.03" />
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(60)" stroke="#FFE082" stroke-width="1.2" stroke-opacity="0.42" fill="#FFD54F" fill-opacity="0.03" />
      <!-- Inner floral/arabesque rosette -->
      <polygon points="0,-24 6,-6 24,0 6,6 0,24 -6,6 -24,0 -6,-6" stroke="#FFF8E1" stroke-width="1" stroke-opacity="0.55" fill="#FFB300" fill-opacity="0.08" />
      <polygon points="0,-24 6,-6 24,0 6,6 0,24 -6,6 -24,0 -6,-6" transform="rotate(45)" stroke="#FFF8E1" stroke-width="1" stroke-opacity="0.55" fill="#FFB300" fill-opacity="0.08" />
      <circle cx="0" cy="0" r="7" stroke="#FFE082" stroke-width="1.2" stroke-opacity="0.6" fill="#FFD54F" fill-opacity="0.2" />
    </g>

    <!-- Reusable Pierced-Brass Fanous Lantern Frame -->
    <g id="fanous-brass-shell">
      <!-- Hanging ring & dome cap -->
      <circle cx="0" cy="0" r="4" stroke="url(#eg-brass-grad)" stroke-width="1.8" />
      <path d="M-8 10 C-8 3, 8 3, 8 10 Z" fill="url(#eg-brass-grad)" />
      <path d="M-18 22 C-12 10, 12 10, 18 22 Z" fill="url(#eg-brass-grad)" stroke="#FFF3B0" stroke-width="0.8" />
      <rect x="-20" y="22" width="40" height="3" rx="1.5" fill="url(#eg-brass-grad)" />
      <!-- Brass ribs & pierced lattice -->
      <path d="M-18 25 L-24 54 L-13 84 L13 84 L24 54 L18 25 Z" stroke="url(#eg-brass-grad)" stroke-width="2" fill="none" />
      <path d="M-7 25 L-10 54 L-5 84 M7 25 L10 54 L5 84" stroke="url(#eg-brass-grad)" stroke-width="1.3" />
      <line x1="-24" y1="54" x2="24" y2="54" stroke="url(#eg-brass-grad)" stroke-width="1.6" />
      <!-- Lower base & finial pendant -->
      <path d="M-15 84 L-19 92 L19 92 L15 84 Z" fill="url(#eg-brass-grad)" />
      <path d="M-9 92 C-6 100, 6 100, 9 92 Z" fill="url(#eg-brass-grad)" />
      <path d="M0 99 L-3 107 L0 112 L3 107 Z" fill="#FFE082" />
    </g>
  </defs>

  <style>
    @keyframes egFanousSwaySlow {
      0%, 100% { transform: rotate(-2.8deg); }
      50% { transform: rotate(2.8deg); }
    }
    @keyframes egFanousSwayMed {
      0%, 100% { transform: rotate(3.2deg); }
      50% { transform: rotate(-3.2deg); }
    }
    @keyframes egHaloPulse {
      0%, 100% { opacity: 0.62; transform: scale(0.94); }
      50% { opacity: 0.98; transform: scale(1.08); }
    }
    @keyframes egKhayamiyaSpinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes egKhayamiyaSpinCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes egNileShimmer {
      0%, 100% { transform: translateX(-18px) scaleX(0.96); opacity: 0.45; }
      50% { transform: translateX(18px) scaleX(1.04); opacity: 0.88; }
    }
    @keyframes egDustFloat {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.25; }
      50% { transform: translateY(-14px) translateX(6px); opacity: 0.75; }
    }

    .eg-sway-1 {
      animation: egFanousSwaySlow 6.8s ease-in-out infinite;
    }
    .eg-sway-2 {
      animation: egFanousSwayMed 5.6s ease-in-out infinite;
    }
    .eg-sway-3 {
      animation: egFanousSwaySlow 7.4s ease-in-out -2.1s infinite;
    }
    .eg-halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: egHaloPulse 4.2s ease-in-out infinite;
    }
    .eg-halo-alt {
      transform-box: fill-box;
      transform-origin: center;
      animation: egHaloPulse 5.1s ease-in-out -1.8s infinite;
    }
    .eg-spin-cw {
      animation: egKhayamiyaSpinCW 48s linear infinite;
    }
    .eg-spin-ccw {
      animation: egKhayamiyaSpinCCW 56s linear infinite;
    }
    .eg-ripple-1 {
      animation: egNileShimmer 5.4s ease-in-out infinite;
    }
    .eg-ripple-2 {
      animation: egNileShimmer 6.8s ease-in-out -2.4s infinite;
    }
    .eg-ripple-3 {
      animation: egNileShimmer 4.7s ease-in-out -1.2s infinite;
    }
    .eg-mote {
      animation: egDustFloat 6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>

  <!-- Subtle Upper Mashrabiya / Fatimid Arch Corner Filigree -->
  <g opacity="0.55">
    <path d="M0 0 L320 0 C210 8, 120 42, 64 110 C28 154, 8 210, 0 265 Z" fill="url(#eg-arch-trim)" />
    <path d="M1280 0 L960 0 C1070 8, 1160 42, 1216 110 C1252 154, 1272 210, 1280 265 Z" fill="url(#eg-arch-trim)" />
    <path d="M0 18 C145 18, 240 58, 310 0" stroke="#FFD54F" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <path d="M1280 18 C1135 18, 1040 58, 970 0" stroke="#FFD54F" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />
  </g>

  <!-- Rotating 12-Point Khayamiya Geometric Star Medallions -->
  <g transform="translate(108, 104)">
    <g class="eg-spin-cw">
      <use href="#khayamiya-medallion" />
    </g>
  </g>

  <g transform="translate(1172, 104)">
    <g class="eg-spin-ccw">
      <use href="#khayamiya-medallion" />
    </g>
  </g>

  <g transform="translate(640, 66) scale(0.76)" opacity="0.78">
    <g class="eg-spin-cw">
      <use href="#khayamiya-medallion" />
    </g>
  </g>

  <g transform="translate(360, 52) scale(0.58)" opacity="0.62">
    <g class="eg-spin-ccw">
      <use href="#khayamiya-medallion" />
    </g>
  </g>

  <g transform="translate(920, 52) scale(0.58)" opacity="0.62">
    <g class="eg-spin-cw">
      <use href="#khayamiya-medallion" />
    </g>
  </g>

  <!-- Hanging Cairo Fanous Lanterns Along Upper Frame -->

  <!-- Lantern 1: Far Left Amber & Ruby Fanous -->
  <g transform="translate(86, 0)">
    <g class="eg-sway-1" style="transform-origin: 0px 0px;">
      <!-- Chain -->
      <line x1="0" y1="0" x2="0" y2="58" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="4 2" />
      <g transform="translate(0, 58)">
        <circle class="eg-halo" cx="0" cy="55" r="76" fill="url(#eg-halo-amber)" />
        <!-- Stained glass panels -->
        <polygon points="-18,25 -7,25 -10,54 -24,54" fill="#FF8F00" fill-opacity="0.58" />
        <polygon points="-7,25 7,25 10,54 -10,54" fill="#FFE082" fill-opacity="0.78" />
        <polygon points="7,25 18,25 24,54 10,54" fill="#E53935" fill-opacity="0.55" />
        <polygon points="-24,54 -10,54 -5,84 -13,84" fill="#E53935" fill-opacity="0.55" />
        <polygon points="-10,54 10,54 5,84 -5,84" fill="#FFD54F" fill-opacity="0.72" />
        <polygon points="10,54 24,54 13,84 5,84" fill="#FF8F00" fill-opacity="0.58" />
        <!-- Inner flame core -->
        <circle cx="0" cy="54" r="6" fill="#FFF8E1" />
        <use href="#fanous-brass-shell" />
      </g>
    </g>
  </g>

  <!-- Lantern 2: Left-Mid Emerald & Gold Fanous -->
  <g transform="translate(228, 0)">
    <g class="eg-sway-2" style="transform-origin: 0px 0px;">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 2" />
      <g transform="translate(0, 34) scale(0.84)">
        <circle class="eg-halo-alt" cx="0" cy="55" r="72" fill="url(#eg-halo-emerald)" />
        <polygon points="-18,25 -7,25 -10,54 -24,54" fill="#00897B" fill-opacity="0.58" />
        <polygon points="-7,25 7,25 10,54 -10,54" fill="#A7FFEB" fill-opacity="0.72" />
        <polygon points="7,25 18,25 24,54 10,54" fill="#00897B" fill-opacity="0.58" />
        <polygon points="-24,54 -10,54 -5,84 -13,84" fill="#FFD54F" fill-opacity="0.58" />
        <polygon points="-10,54 10,54 5,84 -5,84" fill="#64FFDA" fill-opacity="0.68" />
        <polygon points="10,54 24,54 13,84 5,84" fill="#FFD54F" fill-opacity="0.58" />
        <circle cx="0" cy="54" r="5.5" fill="#FFF8E1" />
        <use href="#fanous-brass-shell" />
      </g>
    </g>
  </g>

  <!-- Lantern 3: Left-Inner Petite Ruby Fanous -->
  <g transform="translate(456, 0)">
    <g class="eg-sway-3" style="transform-origin: 0px 0px;">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#D4AF37" stroke-width="1.4" stroke-dasharray="3 2" />
      <g transform="translate(0, 20) scale(0.68)">
        <circle class="eg-halo" cx="0" cy="55" r="68" fill="url(#eg-halo-ruby)" />
        <polygon points="-18,25 18,25 24,54 -24,54" fill="#E53935" fill-opacity="0.62" />
        <polygon points="-24,54 24,54 13,84 -13,84" fill="#FFB300" fill-opacity="0.64" />
        <circle cx="0" cy="54" r="5" fill="#FFF8E1" />
        <use href="#fanous-brass-shell" />
      </g>
    </g>
  </g>

  <!-- Lantern 4: Right-Inner Petite Emerald Fanous -->
  <g transform="translate(824, 0)">
    <g class="eg-sway-1" style="transform-origin: 0px 0px;">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#D4AF37" stroke-width="1.4" stroke-dasharray="3 2" />
      <g transform="translate(0, 20) scale(0.68)">
        <circle class="eg-halo-alt" cx="0" cy="55" r="68" fill="url(#eg-halo-emerald)" />
        <polygon points="-18,25 18,25 24,54 -24,54" fill="#00BFA5" fill-opacity="0.6" />
        <polygon points="-24,54 24,54 13,84 -13,84" fill="#FFD54F" fill-opacity="0.64" />
        <circle cx="0" cy="54" r="5" fill="#FFF8E1" />
        <use href="#fanous-brass-shell" />
      </g>
    </g>
  </g>

  <!-- Lantern 5: Right-Mid Ruby & Amber Fanous -->
  <g transform="translate(1052, 0)">
    <g class="eg-sway-3" style="transform-origin: 0px 0px;">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 2" />
      <g transform="translate(0, 34) scale(0.84)">
        <circle class="eg-halo" cx="0" cy="55" r="72" fill="url(#eg-halo-ruby)" />
        <polygon points="-18,25 -7,25 -10,54 -24,54" fill="#D32F2F" fill-opacity="0.62" />
        <polygon points="-7,25 7,25 10,54 -10,54" fill="#FF8A80" fill-opacity="0.74" />
        <polygon points="7,25 18,25 24,54 10,54" fill="#D32F2F" fill-opacity="0.62" />
        <polygon points="-24,54 -10,54 -5,84 -13,84" fill="#FFB300" fill-opacity="0.6" />
        <polygon points="-10,54 10,54 5,84 -5,84" fill="#FFE082" fill-opacity="0.7" />
        <polygon points="10,54 24,54 13,84 5,84" fill="#FFB300" fill-opacity="0.6" />
        <circle cx="0" cy="54" r="5.5" fill="#FFF8E1" />
        <use href="#fanous-brass-shell" />
      </g>
    </g>
  </g>

  <!-- Lantern 6: Far Right Amber & Emerald Fanous -->
  <g transform="translate(1194, 0)">
    <g class="eg-sway-2" style="transform-origin: 0px 0px;">
      <line x1="0" y1="0" x2="0" y2="58" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="4 2" />
      <g transform="translate(0, 58)">
        <circle class="eg-halo-alt" cx="0" cy="55" r="76" fill="url(#eg-halo-amber)" />
        <polygon points="-18,25 -7,25 -10,54 -24,54" fill="#00897B" fill-opacity="0.56" />
        <polygon points="-7,25 7,25 10,54 -10,54" fill="#FFE082" fill-opacity="0.78" />
        <polygon points="7,25 18,25 24,54 10,54" fill="#FF8F00" fill-opacity="0.58" />
        <polygon points="-24,54 -10,54 -5,84 -13,84" fill="#FF8F00" fill-opacity="0.58" />
        <polygon points="-10,54 10,54 5,84 -5,84" fill="#FFD54F" fill-opacity="0.74" />
        <polygon points="10,54 24,54 13,84 5,84" fill="#00897B" fill-opacity="0.56" />
        <circle cx="0" cy="54" r="6" fill="#FFF8E1" />
        <use href="#fanous-brass-shell" />
      </g>
    </g>
  </g>

  <!-- Ambient Golden Cairo Dusk Motes -->
  <g>
    <circle class="eg-mote" cx="165" cy="210" r="2.2" fill="#FFE082" />
    <circle class="eg-mote" cx="310" cy="145" r="1.8" fill="#FFD54F" style="animation-delay: -1.5s;" />
    <circle class="eg-mote" cx="520" cy="118" r="2" fill="#FFF8E1" style="animation-delay: -3.2s;" />
    <circle class="eg-mote" cx="760" cy="118" r="2" fill="#FFF8E1" style="animation-delay: -2.1s;" />
    <circle class="eg-mote" cx="970" cy="145" r="1.8" fill="#FFD54F" style="animation-delay: -4.3s;" />
    <circle class="eg-mote" cx="1115" cy="210" r="2.2" fill="#FFE082" style="animation-delay: -0.9s;" />
  </g>

  <!-- Shimmering Golden Nile Sunset Ripples Along the Lower Horizon -->
  <g transform="translate(0, 590)">
    <!-- Soft golden water surface glow -->
    <ellipse cx="640" cy="112" rx="540" ry="44" fill="url(#eg-halo-amber)" opacity="0.28" />

    <!-- Tier 1: Distant horizon ripples -->
    <g class="eg-ripple-1">
      <path d="M250 38 Q445 30, 640 38 T1030 38" stroke="url(#eg-nile-gold)" stroke-width="1.6" stroke-linecap="round" />
      <path d="M340 50 Q510 44, 680 50 T980 50" stroke="url(#eg-nile-gold)" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="640" cy="44" rx="115" ry="2.2" fill="url(#eg-nile-gold)" />
    </g>

    <!-- Tier 2: Mid-water golden reflections -->
    <g class="eg-ripple-2">
      <path d="M160 72 Q400 62, 640 72 T1120 72" stroke="url(#eg-nile-gold)" stroke-width="2.4" stroke-linecap="round" />
      <path d="M220 88 Q460 80, 700 88 T1060 88" stroke="url(#eg-nile-gold)" stroke-width="1.8" stroke-linecap="round" />
      <ellipse cx="520" cy="78" rx="95" ry="2.5" fill="url(#eg-nile-gold)" />
      <ellipse cx="770" cy="84" rx="105" ry="2.5" fill="url(#eg-nile-gold)" />
    </g>

    <!-- Tier 3: Foreground Nile sun-path shimmer -->
    <g class="eg-ripple-3">
      <path d="M90 108 Q365 96, 640 108 T1190 108" stroke="url(#eg-nile-gold)" stroke-width="2.8" stroke-linecap="round" />
      <path d="M180 126 Q420 116, 660 126 T1100 126" stroke="url(#eg-nile-gold)" stroke-width="2.2" stroke-linecap="round" />
      <path d="M290 142 Q490 135, 690 142 T990 142" stroke="url(#eg-nile-gold)" stroke-width="1.6" stroke-linecap="round" />
      <ellipse cx="640" cy="116" rx="150" ry="3" fill="url(#eg-nile-gold)" />
    </g>
  </g>
</svg>
