      <text x="65" y="78" text-anchor="middle" fill="#F8FAFC" font-size="11">Traboule &amp; Loom</text>
      <text x="65" y="146" text-anchor="middle" fill="#94A3B8" font-size="11">Passageways &amp; Craft</text>
    </g>
