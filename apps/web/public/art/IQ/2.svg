<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Iraqi Date Harvest &amp; Fragrant Cardamom</title>
  <desc>Watercolor composition of rich Mesopotamian date varieties piled in a woven palm basket alongside a traditional brass mortar and pestle with fragrant green cardamom pods.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="basket-weave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8935c" />
      <stop offset="100%" stop-color="#805e2e" />
    </linearGradient>
    <radialGradient id="brass-mortar" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="50%" stop-color="#c49a37" />
      <stop offset="100%" stop-color="#694e11" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="500" fill="#faf6ee" />
  
  <!-- Wooden preparation table -->
  <rect y="220" width="800" height="280" fill="#be9b7b" />
  <line x1="0" y1="220" x2="800" y2="220" stroke="#876648" stroke-width="4" />

  <!-- Woven palm leaf basket piled high with Iraqi dates (Tamar) -->
  <g transform="translate(160, 190)">
    <ellipse cx="120" cy="120" rx="130" ry="40" fill="#694d28" />
    <path d="M-10,40 C0,150 240,150 250,40 Z" fill="url(#basket-weave)" stroke="#5e411b" stroke-width="3" />
    <ellipse cx="120" cy="40" rx="130" ry="35" fill="#7a572a" />
    <!-- Mounded dates (glossy caramel & dark mahogany) -->
    <ellipse cx="60" cy="30" rx="20" ry="11" transform="rotate(-15 60 30)" fill="#4a2211" stroke="#2e1206" />
    <ellipse cx="95" cy="20" rx="21" ry="12" transform="rotate(25 95 20)" fill="#783e1d" stroke="#3b1c09" />
    <ellipse cx="135" cy="15" rx="22" ry="12" transform="rotate(-5 135 15)" fill="#5c2c14" stroke="#2e1206" />
    <ellipse cx="175" cy="25" rx="20" ry="11" transform="rotate(20 175 25)" fill="#854823" stroke="#3b1c09" />
    <ellipse cx="80" cy="45" rx="21" ry="12" transform="rotate(10 80 45)" fill="#5c2c14" stroke="#2e1206" />
    <ellipse cx="120" cy="38" rx="22" ry="12" transform="rotate(-20 120 38)" fill="#783e1d" stroke="#3b1c09" />
    <ellipse cx="155" cy="42" rx="20" ry="11" transform="rotate(15 155 42)" fill="#4a2211" stroke="#2e1206" />
  </g>

  <!-- Brass mortar and pestle (Hawan) with green cardamom pods -->
  <g transform="translate(520, 230)">
    <!-- Mortar vessel -->
    <path d="M30,30 L20,130 L140,130 L130,30 Z" fill="url(#brass-mortar)" />
    <ellipse cx="80" cy="30" rx="55" ry="16" fill="#7d601b" />
    <ellipse cx="80" cy="30" rx="46" ry="12" fill="#3d2c07" />
    <!-- Pestle angled inside -->
    <polygon points="90,-20 105,-15 70,80 58,75" fill="url(#brass-mortar)" />
    <!-- Green cardamom pods in dish nearby -->
    <ellipse cx="200" cy="90" rx="45" ry="20" fill="#dfd7c7" stroke="#b2a691" stroke-width="2" />
    <ellipse cx="185" cy="88" rx="10" ry="5" transform="rotate(20 185 88)" fill="#70974b" stroke="#48682a" />
    <ellipse cx="205" cy="85" rx="10" ry="5" transform="rotate(-30 205 85)" fill="#81aa57" stroke="#48682a" />
    <ellipse cx="215" cy="92" rx="9" ry="5" transform="rotate(15 215 92)" fill="#62863e" stroke="#48682a" />
  </g>
  
</svg>