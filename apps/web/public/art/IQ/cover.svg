<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Baghdad Courtyard &amp; Tigris River Palms</title>
  <desc>Watercolor illustration of an ancient Baghdad courtyard with traditional brick arches, ornate carved wooden shanashil windows, turquoise tiled fountain, and towering date palms along the Tigris.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="iq-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#49658a" />
      <stop offset="50%" stop-color="#8baec9" />
      <stop offset="85%" stop-color="#f8dcad" />
      <stop offset="100%" stop-color="#fed695" />
    </linearGradient>
    <linearGradient id="brick-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2b988" />
      <stop offset="60%" stop-color="#caa070" />
      <stop offset="100%" stop-color="#ab8254" />
    </linearGradient>
    <radialGradient id="turquoise-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="50%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#023e8a" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <!-- Sky viewed through courtyard arches -->
  <rect width="800" height="350" fill="url(#iq-sky)" />

  <!-- Tigris River & Date Palms in background opening -->
  <rect y="240" width="800" height="90" fill="#6d9bb5" opacity="0.6" />
  <!-- Palms along river -->
  <g fill="#3e5330">
    <path d="M260,260 Q265,150 280,120 Q270,160 262,260 Z" />
    <path d="M280,120 Q240,100 220,120 Q250,130 280,120" />
    <path d="M280,120 Q310,95 335,115 Q305,125 280,120" />
    <path d="M280,120 Q260,80 275,70 Q285,100 280,120" />

    <path d="M510,260 Q520,160 535,130 Q525,170 512,260 Z" />
    <path d="M535,130 Q495,110 475,130 Q505,140 535,130" />
    <path d="M535,130 Q565,105 590,125 Q560,135 535,130" />
  </g>

  <!-- Traditional Baghdad Courtyard Architecture -->
  <!-- Back Wall & Grand Brick Arch -->
  <path d="M0,0 L200,0 L200,320 L0,320 Z" fill="url(#brick-wall)" />
  <path d="M600,0 L800,0 L800,320 L600,320 Z" fill="url(#brick-wall)" />
  <!-- Pointed Arch Overhead -->
  <path d="M200,320 L200,120 Q400,-20 600,120 L600,320" fill="none" stroke="url(#brick-wall)" stroke-width="40" />

  <!-- Traditional Ornate Shanashil (Wooden bay window) on Left Wall -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="120" height="150" fill="#4a2e19" />
    <!-- Intricate lattice patterns -->
    <rect x="15" y="20" width="40" height="50" fill="#2d1a0c" stroke="#8c5828" stroke-width="2" />
    <rect x="65" y="20" width="40" height="50" fill="#2d1a0c" stroke="#8c5828" stroke-width="2" />
    <rect x="15" y="80" width="40" height="50" fill="#2d1a0c" stroke="#8c5828" stroke-width="2" />
    <rect x="65" y="80" width="40" height="50" fill="#2d1a0c" stroke="#8c5828" stroke-width="2" />
    <!-- Colored glass inserts (stained glass jewel dots) -->
    <circle cx="35" cy="45" r="5" fill="#00b4d8" />
    <circle cx="85" cy="45" r="5" fill="#f77f00" />
    <circle cx="35" cy="105" r="5" fill="#d62828" />
    <circle cx="85" cy="105" r="5" fill="#2a9d8f" />
    <!-- Decorative corbels underneath -->
    <polygon points="0,150 25,185 40,150" fill="#3b2413" />
    <polygon points="80,150 95,185 120,150" fill="#3b2413" />
  </g>

  <!-- Paved Courtyard Floor -->
  <path d="M0,320 L800,320 L800,500 L0,500 Z" fill="#d9be9b" />
  <!-- Floor geometric tile lines -->
  <line x1="0" y1="400" x2="800" y2="400" stroke="#bda27e" stroke-width="2" />
  <line x1="150" y1="320" x2="50" y2="500" stroke="#bda27e" stroke-width="2" />
  <line x1="650" y1="320" x2="750" y2="500" stroke="#bda27e" stroke-width="2" />

  <!-- Central Octagonal Turquoise Tiled Water Fountain -->
  <g transform="translate(400, 410)">
    <!-- Outer basin ring -->
    <polygon points="-140,0 -100,-35 100,-35 140,0 100,35 -100,35" fill="#cbb391" stroke="#8d7253" stroke-width="3" />
    <!-- Inner water pool -->
    <polygon points="-125,0 -90,-28 90,-28 125,0 90,28 -90,28" fill="url(#turquoise-pool)" />
    <!-- Water ripples -->
    <ellipse cx="0" cy="0" rx="40" ry="12" fill="none" stroke="#caf0f8" stroke-width="2" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="15" ry="5" fill="none" stroke="#caf0f8" stroke-width="2" opacity="0.8" />
    <!-- Center bubbling sprout -->
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Potted Jasmine and Pomegranate Plants -->
  <g transform="translate(620, 290)">
    <path d="M15,50 L25,95 L75,95 L85,50 Z" fill="#b05c38" />
    <ellipse cx="50" cy="50" rx="35" ry="12" fill="#8f4323" />
    <!-- Leaves -->
    <ellipse cx="40" cy="20" rx="35" ry="25" fill="#4d6f3b" />
    <ellipse cx="65" cy="15" rx="30" ry="20" fill="#608b49" />
    <!-- White jasmine blossoms -->
    <circle cx="35" cy="15" r="4" fill="#fff" />
    <circle cx="55" cy="10" r="4" fill="#fff" />
    <circle cx="65" cy="25" r="4" fill="#fff" />
  </g>
  
</svg>