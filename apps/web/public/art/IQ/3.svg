<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Baking Kleicha Pastries at the Clay Oven</title>
  <desc>Cozy scene of traditional Iraqi cardamom-spiced kleicha date pastries being shaped with hand-carved wooden molds and baked near a warm clay hearth oven.</desc>
  <defs>
    <filter id="wc-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffbee" surfaceScale="1.0" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="hearth-fire" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffe394" />
      <stop offset="30%" stop-color="#ff8c38" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#b73212" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#241108" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kleicha-golden" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fbe4ad" />
      <stop offset="60%" stop-color="#e3b666" />
      <stop offset="100%" stop-color="#a4752c" />
    </radialGradient>
    
  </defs>
  <rect width="800" height="500" fill="#fffdfa" />

  <rect width="800" height="500" fill="#2d1c15" />

  <!-- Domed Clay Oven (Tannour) -->
  <g transform="translate(140, 100)">
    <circle cx="160" cy="200" r="180" fill="url(#hearth-fire)" />
    <!-- Oven exterior -->
    <path d="M40,360 C20,180 300,180 280,360 Z" fill="#80563b" stroke="#52331f" stroke-width="6" />
    <!-- Glowing arch mouth -->
    <ellipse cx="160" cy="270" rx="75" ry="60" fill="#1b0e07" />
    <ellipse cx="160" cy="280" rx="60" ry="45" fill="#fca311" filter="url(#soft-glow)" />
    <!-- Charcoal coals -->
    <circle cx="140" cy="300" r="15" fill="#ff4d00" />
    <circle cx="180" cy="305" r="12" fill="#ffb703" />
  </g>

  <!-- Wooden Kleicha Mold (Qalb Kleicha) & Pastry Tray -->
  <g transform="translate(460, 200)">
    <!-- Carved wooden mold stamp with handle -->
    <path d="M40,110 L140,110 L150,150 L30,150 Z" fill="#9c663b" stroke="#683f1d" stroke-width="2" />
    <rect x="75" y="150" width="30" height="50" rx="15" fill="#855127" />
    <!-- Rosette carved impression in the mold -->
    <circle cx="90" cy="130" r="18" fill="#523114" />
    <circle cx="90" cy="130" r="14" fill="none" stroke="#dcb487" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Brass Baking Tray with Fresh Kleicha -->
    <ellipse cx="120" cy="220" rx="150" ry="65" fill="#c49a45" stroke="#7a5b1f" stroke-width="3" />
    <!-- Kleicha pastry 1 (Sunburst / Rosette pattern) -->
    <ellipse cx="50" cy="210" rx="26" ry="16" fill="url(#kleicha-golden)" />
    <ellipse cx="50" cy="210" rx="16" ry="10" fill="none" stroke="#8c581a" stroke-width="1.5" stroke-dasharray="3,2" />
    <!-- Kleicha pastry 2 (Date swirl / rolled) -->
    <ellipse cx="115" cy="200" rx="28" ry="17" fill="url(#kleicha-golden)" />
    <path d="M100,200 Q115,190 130,200 Q115,210 100,200" fill="#4d2411" />
    <!-- Kleicha pastry 3 (Half-moon stuffed) -->
    <path d="M150,225 C150,205 190,205 190,225 Z" fill="url(#kleicha-golden)" stroke="#8c581a" stroke-width="1.5" />
    <circle cx="170" cy="218" r="2" fill="#5a350c" />
  </g>
  
</svg>